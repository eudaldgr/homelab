---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: flux
  annotations:
    homelab.eudald.gr/description: Reconcile only the isolated kubernetes/apps tree
spec:
  deletionPolicy: Orphan
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
