---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: home-assistant-mcp
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-system
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /kubernetes/home-automation/home-assistant-mcp
      recursive: false
  targets:
    - name: home-assistant-mcp-secret
      namespace: home-automation
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          HOMEASSISTANT_TOKEN: "{{ .HOMEASSISTANT_TOKEN.Value }}"
