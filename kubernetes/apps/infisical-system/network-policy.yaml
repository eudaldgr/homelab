---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: audit-infisical-operator-access
  labels:
    app.kubernetes.io/name: secrets-operator
    app.kubernetes.io/part-of: infisical
  annotations:
    homelab.eudald.gr/description: Audit operator access before enforcing default-deny
spec:
  description: Audit Kubernetes API, DNS, metrics, health probes, and Infisical Cloud access.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: infisical-operator
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
