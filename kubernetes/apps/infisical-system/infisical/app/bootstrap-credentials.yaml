---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: infisical-bootstrap-credentials
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: infisical
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-system
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /kubernetes/platform/infisical
      recursive: false
  targets:
    - name: infisical-universal-auth
      namespace: infisical-system
      kind: Secret
      creationPolicy: Orphan
      template:
        engineVersion: v1
        data:
          clientId: "{{ .INFISICAL_CLIENT_ID.Value }}"
          clientSecret: "{{ .INFISICAL_CLIENT_SECRET.Value }}"
