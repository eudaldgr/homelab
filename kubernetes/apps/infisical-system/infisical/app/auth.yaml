---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: infisical
  labels:
    app.kubernetes.io/name: infisical
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: infisical
  annotations:
    homelab.eudald.gr/description: Universal Auth credentials are injected only during bootstrap
spec:
  infisicalConnectionRef:
    name: infisical-cloud
    namespace: infisical-system
  method: universal
  universal:
    clientIdRef:
      name: infisical-universal-auth
      namespace: infisical-system
      key: clientId
    clientSecretRef:
      name: infisical-universal-auth
      namespace: infisical-system
      key: clientSecret
