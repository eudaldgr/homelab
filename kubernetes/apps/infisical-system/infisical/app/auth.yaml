---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: infisical
spec:
  infisicalConnectionRef:
    name: infisical-cloud
    namespace: infisical-system
  method: universal
  universal:
    clientIdRef:
      name: infisical-universal-auth
      namespace: infisical-system
      key: clientId
    clientSecretRef:
      name: infisical-universal-auth
      namespace: infisical-system
      key: clientSecret