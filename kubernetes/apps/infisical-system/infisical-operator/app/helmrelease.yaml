---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-operator
  labels:
    app.kubernetes.io/part-of: infisical
spec:
  chart:
    spec:
      chart: secrets-operator
      version: 0.11.4
      sourceRef:
        kind: HelmRepository
        name: infisical
  interval: 1h
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 3
  rollback:
    cleanupOnFail: true
  values:
    hostAPI: https://eu.infisical.com/api
    installCRDs: true
    scopedNamespaces:
      - infisical-system
      - kopiur-system
      - cert-manager
    scopedRBAC: true
    controllerManager:
      replicas: 1
      manager:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
