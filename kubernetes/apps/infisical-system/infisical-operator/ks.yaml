---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-operator
  labels:
    app.kubernetes.io/part-of: infisical
  annotations:
    homelab.eudald.gr/description: Install the Infisical Kubernetes Operator V2 and its CRDs
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: infisical-operator
      namespace: infisical-system
  interval: 1h
  path: ./kubernetes/apps/infisical-system/infisical-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: infisical-system
  timeout: 10m
  wait: true
