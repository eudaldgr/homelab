---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
  labels:
    app.kubernetes.io/part-of: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  timeout: 10m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  rollback:
    cleanupOnFail: true
  values:
    installScope: cluster
    monitoring:
      serviceMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
        labels:
          release: kube-prometheus-stack
      prometheusRule:
        enabled: true
        labels:
          release: kube-prometheus-stack
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 2Gi
    webhook:
      failurePolicy: Fail
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
      serviceMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
        insecureSkipVerify: true
        labels:
          release: kube-prometheus-stack
      tls:
        mode: self
        secretName: kopiur-webhook-tls
