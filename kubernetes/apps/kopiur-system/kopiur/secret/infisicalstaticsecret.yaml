---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: kopiur-repository
  labels:
    app.kubernetes.io/name: kopiur
    app.kubernetes.io/component: repository-credentials
    app.kubernetes.io/part-of: kopiur
  annotations:
    homelab.eudald.gr/description: Sync the RustFS repository credentials from Infisical
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-system
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /kubernetes/platform/kopiur
      recursive: false
  targets:
    - name: kopiur-repository-secret
      namespace: kopiur-system
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY.Value }}"
          KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD.Value }}"
