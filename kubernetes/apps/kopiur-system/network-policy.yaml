---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: audit-kopiur-access
  labels:
    app.kubernetes.io/name: kopiur
    app.kubernetes.io/part-of: kopiur
  annotations:
    homelab.eudald.gr/description: Audit Kopiur access before enforcing default-deny
spec:
  description: Audit Kopiur controller and webhook access without enabling default-deny.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kopiur
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kopiur-system
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kopiur-system
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
