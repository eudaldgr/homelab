---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: radarr
spec:
  infisicalAuthRef:
    name: infisical
    namespace: infisical-system
  syncOptions:
    refreshInterval: 5m
  sources:
    - projectSlug: homelab
      environmentSlug: prod
      secretPath: /kubernetes/downloads/radarr
      recursive: false
  targets:
    - name: radarr-secret
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          RADARR__AUTH__APIKEY: "{{ .RADARR_API_KEY.Value }}"
    # Envoy apiKeyAuth format: <client id>: <api key>
    - name: radarr-apikey
      namespace: downloads
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          radarr: "{{ .RADARR_API_KEY.Value }}"
