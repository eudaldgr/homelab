---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synology-csi
spec:
  releaseName: synology-csi
  targetNamespace: synology-csi
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm
      interval: 1h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: synology-csi
        namespace: synology-csi
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 3
  rollback:
    cleanupOnFail: true
  values:
    clientInfoSecret:
      create: false
      name: synology-csi-client-info
    fullnameOverride: synology-csi
    installCSIDriver: true
    node:
      extraArgs:
        - --iscsiadm-path=/usr/local/sbin/iscsiadm
      kubeletPath: /var/lib/kubelet
    storageClasses:
      synology-iscsi-storage:
        disabled: true
      synology-iscsi:
        isDefault: false
        reclaimPolicy: Retain
        volumeBindingMode: WaitForFirstConsumer
        parameters:
          enableFuaSyncCache: "true"
          fsType: ext4
          location: /volume1
          protocol: iscsi
    volumeSnapshotClasses: null
  postRenderers:
    - kustomize:
        patches:
          # Keep the staging driver in basic mode even after Rook installs the
          # VolumeSnapshot CRDs later in the migration.
          - target:
              version: v1
              kind: ServiceAccount
              name: synology-csi-snapshotter
            patch: |-
              $patch: delete
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: synology-csi-snapshotter
          - target:
              group: rbac.authorization.k8s.io
              kind: ClusterRole
              name: synology-csi-snapshotter
            patch: |-
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: synology-csi-snapshotter
          - target:
              group: rbac.authorization.k8s.io
              kind: ClusterRoleBinding
              name: synology-csi-snapshotter
            patch: |-
              $patch: delete
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: synology-csi-snapshotter
          - target:
              group: apps
              kind: StatefulSet
              name: synology-csi-snapshotter
            patch: |-
              $patch: delete
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: synology-csi-snapshotter
          - target:
              group: apps
              kind: StatefulSet
              name: synology-csi-controller
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 200m, memory: 128Mi }
              - op: add
                path: /spec/template/spec/containers/1/resources
                value:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 200m, memory: 128Mi }
              - op: add
                path: /spec/template/spec/containers/2/resources
                value:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 200m, memory: 128Mi }
              - op: add
                path: /spec/template/spec/containers/3/resources
                value:
                  requests: { cpu: 20m, memory: 64Mi }
                  limits: { cpu: 500m, memory: 256Mi }
          - target:
              group: apps
              kind: DaemonSet
              name: synology-csi-node
            patch: |-
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { cpu: 200m, memory: 128Mi }
              - op: add
                path: /spec/template/spec/containers/1/resources
                value:
                  requests: { cpu: 20m, memory: 64Mi }
                  limits: { cpu: 500m, memory: 256Mi }