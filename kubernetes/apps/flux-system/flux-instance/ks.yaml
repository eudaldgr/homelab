---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  labels:
    app.kubernetes.io/part-of: flux
  annotations:
    homelab.eudald.gr/description: Reconcile the FluxInstance that manages the Flux controllers and cluster sync
spec:
  dependsOn:
    - name: flux-operator
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flux-instance
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-instance/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  timeout: 10m
  wait: false
