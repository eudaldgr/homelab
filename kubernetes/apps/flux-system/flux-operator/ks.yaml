---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  labels:
    app.kubernetes.io/part-of: flux
  annotations:
    homelab.eudald.gr/description: Reconcile the Flux Operator Helm release after bootstrap
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: flux-operator
      namespace: flux-system
  interval: 1h
  path: ./kubernetes/apps/flux-system/flux-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  timeout: 10m
  wait: true
