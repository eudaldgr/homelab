---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  labels:
    app.kubernetes.io/part-of: flux
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  install:
    remediation:
      retries: 3
  interval: 1h
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 3
  values:
    serviceMonitor:
      create: true
