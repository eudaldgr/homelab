---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app snmp-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: snmp-exporter
  interval: 1h
  values:
    fullnameOverride: *app
    image:
      repository: quay.io/prometheus/snmp-exporter
      tag: v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    envFrom:
      - secretRef:
          name: snmp-exporter-secret
    extraArgs:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.expand-environment-variables
    # Keep the image's generated modules; this second config adds only SNMPv3 auth.
    config: |
      auths:
        synology_v3:
          version: 3
          security_level: authPriv
          username: ${SNMP_USERNAME}
          password: ${SNMP_AUTH_PASSWORD}
          auth_protocol: SHA
          priv_protocol: AES
          priv_password: ${SNMP_PRIV_PASSWORD}
    serviceMonitor:
      enabled: true
      params:
        - name: synology
          module:
            - synology
            - if_mib
            - ucd_system_stats
            - ucd_memory
            - ucd_la_table
            - hrStorage
            - hrSystem
            - system
          target: ds920plus.lan.eudald.gr
          auth:
            - synology_v3
      path: /snmp
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels:
            - __param_target
          targetLabel: instance
        - targetLabel: job
          replacement: synology
