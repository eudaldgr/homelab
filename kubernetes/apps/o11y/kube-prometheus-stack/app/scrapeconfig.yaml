---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: cadi-gatus
spec:
  staticConfigs:
    - targets:
        - cadi-gatus.eudald.gr
  metricsPath: /metrics
  scheme: HTTPS
  relabelings:
    - action: replace
      targetLabel: job
      replacement: cadi-gatus
