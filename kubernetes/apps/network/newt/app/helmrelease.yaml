---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt
spec:
  chartRef:
    kind: OCIRepository
    name: newt
  interval: 1h
  values:
    global:
      fullnameOverride: newt
      image:
        registry: docker.io
        repository: fosrl/newt
        tag: 1.14.0@sha256:60c78391e3b5cb8a260490fb26b8b7329ed5448077629da89a564af80d3a9fad
        imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 65534
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: [ALL]
      podSecurityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
      health:
        enabled: true
    newtInstances:
      - name: main-tunnel
        enabled: true
        auth:
          existingSecretName: newt-credentials
          createSecret: false
        acceptClients: true
        extraEnv:
          BLUEPRINT_FILE: /etc/newt/blueprint.yaml
          HOME: /tmp
        extraVolumes:
          - name: newt-blueprint
            configMap:
              name: newt-blueprint
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
        extraVolumeMounts:
          - name: newt-blueprint
            mountPath: /etc/newt
            readOnly: true
          - name: tmp
            mountPath: /tmp
        dockerSocket:
          enabled: false
        service:
          enabled: true
          type: LoadBalancer
          annotations:
            lbipam.cilium.io/ips: "10.1.42.131"
  postRenderers:
    - kustomize:
        patches:
          - patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
            target:
              kind: Deployment
              name: newt-main-tunnel