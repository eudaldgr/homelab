---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./infisicalstaticsecret.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: newt-blueprint
    files:
      - blueprint.yaml=./blueprints/public-resources.yaml
generatorOptions:
  disableNameSuffixHash: true