---
- name: Create manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: manifests

- name: Deploy kured manifest
  ansible.builtin.template:
    src: kured.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/kured.yaml
    owner: root
    group: root
    mode: "0644"
  tags:
    - manifests
    - kured

- name: Wait for kured DaemonSet to be ready
  ansible.builtin.command: |
    /usr/local/bin/k3s kubectl rollout status daemonset/kured -n kube-system --timeout=300s
  register: kured_rollout
  changed_when: false
  until: kured_rollout.rc == 0
  retries: 3
  delay: 10
  tags:
    - manifests
    - kured
