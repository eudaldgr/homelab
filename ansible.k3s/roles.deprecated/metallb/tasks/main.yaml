---
- name: Wait for k8s nodes to be ready, otherwise we cannot start metallb deployment
  ansible.builtin.command:
    cmd: "kubectl wait --for=condition=Ready nodes --all --timeout=600s"
  retries: 3
  delay: 10
  register: metallb_nodes_ready
  until: metallb_nodes_ready.rc == 0
  changed_when: false
  tags: k8s

- name: Apply metallb manifest
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
  changed_when: true
  tags: metallb

- name: Wait for metallb pods to be ready, otherwise we cannot start metallb deployment
  ansible.builtin.command:
    cmd: "kubectl wait --namespace metallb-system --for=condition=ready pod --selector=component=controller --timeout=1800s"
  changed_when: true
  tags: metallb

- name: Copy metallb L2 Advertisement template
  ansible.builtin.copy:
    src: "{{ role_path }}/files/metallb-l2.yaml"
    dest: /home/{{ ansible_user }}/l2.yaml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: metallb

- name: Copy metallb IPPool template
  ansible.builtin.template:
    src: "{{ role_path }}/templates/metallb-ippool.yaml.j2"
    dest: /home/{{ ansible_user }}/ippool.yaml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  tags: metallb

- name: Apply metallb config
  ansible.builtin.command:
    cmd: kubectl apply -f /home/{{ ansible_user }}/{{ item }}.yaml
  loop:
    - ippool
    - l2
  changed_when: true
  tags: metallb
