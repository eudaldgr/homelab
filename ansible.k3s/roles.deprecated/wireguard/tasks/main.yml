- name: Generate WireGuard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart wg-quick@wg0
  tags: wireguard

- name: Enable and start wg-quick@wg0 service
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started
  tags: wireguard

- name: Wait for WireGuard interface to be up
  ansible.builtin.wait_for:
    path: /sys/class/net/wg0/operstate
    timeout: 30
  tags: wireguard
