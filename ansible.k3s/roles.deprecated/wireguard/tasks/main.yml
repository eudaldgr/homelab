---
- name: Install WireGuard tools
  community.general.zypper:
    name:
      - wireguard-tools
    state: present
  register: wg_packages
  tags: packages

- name: Unconditionally reboot the machine after package install
  ansible.builtin.reboot:
    pre_reboot_delay: 10
    reboot_command: "/usr/bin/systemctl reboot"
    test_command: uptime
  when: wg_packages.changed # noqa: no-handler
  tags: reboot

- name: Ensure WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: wireguard

- name: Generate WireGuard private key
  ansible.builtin.shell: |
    umask 077
    wg genkey > /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key
  tags: wireguard

- name: Generate WireGuard public key
  ansible.builtin.shell: |
    wg pubkey < /etc/wireguard/private.key > /etc/wireguard/public.key
  args:
    creates: /etc/wireguard/public.key
  tags: wireguard

- name: Read WireGuard private key
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key
  tags: wireguard

- name: Read WireGuard public key
  ansible.builtin.slurp:
    src: /etc/wireguard/public.key
  register: wg_public_key
  tags: wireguard

- name: Set WireGuard key facts
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ wg_private_key.content | b64decode | trim }}"
    wireguard_public_key: "{{ wg_public_key.content | b64decode | trim }}"
  tags: wireguard

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  tags: sysctl

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  tags: sysctl

# - name: Configure rp_filter for BGP (loose mode)
