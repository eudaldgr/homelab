---
- name: Create directory for transactional-update config
  ansible.builtin.file:
    path: /etc/transactional-update.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: system

- name: Configure transactional-update to use kured for reboots
  ansible.builtin.copy:
    dest: /etc/transactional-update.conf.d/50-kured.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Use kured for coordinated reboots
      REBOOT_METHOD=kured
  tags: system

- name: Enable transactional-update timer for automatic updates
  ansible.builtin.systemd_service:
    name: transactional-update.timer
    state: started
    enabled: true
  tags: services

- name: Disable rebootmgr service
  ansible.builtin.systemd_service:
    name: rebootmgr
    state: stopped
    enabled: false
  tags: services

- name: Create directory for Kured Manifest
  ansible.builtin.file:
    path: "/var/lib/rancher/k3s/server/manifests"
    state: directory
    mode: "0755"
  when: inventory_hostname in groups['servers'][0]
  tags: kured

- name: Deploy Kured Configuration
  ansible.builtin.template:
    src: "{{ role_path }}/files/kured.yaml"
    dest: /var/lib/rancher/k3s/server/manifests/kured.yaml
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['servers'][0]
  tags: kured
