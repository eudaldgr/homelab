---
- name: Ensure ArgoCD namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: argocd
    state: present
  register: argocd_namespace
  until: argocd_namespace is succeeded
  tags: argocd

# - name: Install / upgrade ArgoCD via Helm
#   kubernetes.core.helm:
#     name: argocd
#     chart_ref: argo-cd
#     namespace: argocd
#     chart_repo_url: "{{ argocd_repo_url }}"
#     chart_version: "{{ argocd_version }}"
#     values: "{{ argocd_values }}"
#   tags: argocd

- name: Create temporary ArgoCD values file
  ansible.builtin.copy:
    content: "{{ argocd_values | to_nice_yaml }}"
    dest: /tmp/argocd-values.yaml
    owner: root
    group: root
    mode: "0644"
  tags: argocd

- name: Install / upgrade ArgoCD via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install argocd argo-cd
      --repo {{ argocd_repo_url }}
      --version {{ argocd_version }}
      --namespace argocd
      --values /tmp/argocd-values.yaml
      --kubeconfig {{ kubeconfig_path }}
  changed_when: true
  tags: argocd

- name: Wait for ArgoCD server to be available
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: argocd
    name: argocd-server
  register: argocd_service
  until: argocd_service.resources is defined and argocd_service.resources | length > 0
  retries: 10
  delay: 15
  tags: argocd

- name: Wait for ArgoCD admin secret to exist
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: argocd
    name: argocd-initial-admin-secret
  register: argocd_admin_secret
  until: argocd_admin_secret.resources | length > 0
  retries: 10
  delay: 10
  tags: argocd

- name: Decode ArgoCD initial admin password
  ansible.builtin.set_fact:
    argocd_admin_password: "{{ argocd_admin_secret.resources[0].data.password | b64decode }}"
  when: argocd_admin_secret is succeeded
  tags: argocd

- name: Output ArgoCD initial admin password
  ansible.builtin.debug:
    msg: "ArgoCD initial admin password is {{ argocd_admin_password }}"
  when: argocd_admin_password is defined
  tags: argocd
