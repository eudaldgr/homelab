---
- name: Download k3s binary x86
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s
    checksum: sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  tags: k3s

- name: Create symlinks for kubectl and crictl
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/{{ item }}
    state: link
  loop:
    - kubectl
    - crictl
    - ctr
  tags: k3s

- name: Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - /etc/rancher/node
    - "{{ k3s_data_dir }}/agent/pod-manifests"
  tags: k3s

- name: Start first server
  when: inventory_hostname == groups['servers'][0]
  tags: k3s
  block:
    - name: Copy K3s config files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - src: k3s.config.yaml.j2
          dest: "{{ k3s_config_file }}"
        - src: k3s.service.j2
          dest: "{{ k3s_service_file }}"

    - name: Enable k3s service
      ansible.builtin.systemd_service:
        name: k3s
        daemon_reload: true
        state: restarted
        enabled: true
      register: k3s_service
      until: k3s_service is succeeded
      retries: 5

    - name: Wait for node-token
      ansible.builtin.wait_for:
        path: "{{ k3s_node_token_file }}"

    - name: Read node-token from server
      ansible.builtin.slurp:
        src: "{{ k3s_node_token_file }}"
      register: k3s_node_token
  rescue:
    - name: Fail if first server setup fails
      ansible.builtin.fail:
        msg: "Failed to set up the first k3s server node."

- name: Share k3s token with all nodes
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[groups['servers'][0]].k3s_node_token.content | b64decode | regex_replace('\n', '') }}"
  tags: k3s

- name: Copy K3s config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: k3s.config.yaml.j2
      dest: "{{ k3s_config_file }}"
    - src: k3s.service.j2
      dest: "{{ k3s_service_file }}"
  tags: k3s

