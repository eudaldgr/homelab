- name: Enable k3s service
  ansible.builtin.systemd_service:
    name: k3s
    daemon_reload: true
    state: restarted
    enabled: true
  register: k3s_service
  until: k3s_service is succeeded
  retries: 5
  tags: k3s

- name: Fetch kubeconfig file
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/k3s-homelab.conf"
    flat: true
  when: inventory_hostname == groups['servers'][0]
  tags: k3s

- name: Update kubeconfig locally
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/k3s-homelab.conf"
    regexp: "127.0.0.1:6443"
    replace: "{{ hostvars[groups['servers'][0]]['ansible_host'] }}:6443"
  run_once: true
  become: false
  delegate_to: localhost
  tags: k3s

- name: Update kubeconfig on first server
  when: inventory_hostname == groups['servers'][0]
  tags: k3s
  block:
    - name: Update k3s config
      ansible.builtin.replace:
        path: "{{ k3s_config_file }}"
        regexp: "cluster-init: true"
        replace: |
          token: {{ k3s_token }}
          server: https://{{ hostvars[groups['servers'][0]]['ansible_host'] }}:6443

    - name: Restart k3s service to apply new config
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted

- name: Taint and label nodes
  when: inventory_hostname == groups['servers'][0]
  tags: k3s
  block:
    - name: Label agents nodes # noqa: no-changed-when
      ansible.builtin.shell: |
        kubectl label node {{ item }} node-role.kubernetes.io/worker=true --overwrite
      loop: "{{ groups['agents'] }}"

- name: Include intel gpu selinux tasks
  ansible.builtin.import_tasks:
    file: intel_gpu_selinux.yaml
  when:
    - hostvars[inventory_hostname].gpu is defined
    - hostvars[inventory_hostname].gpu | bool
  tags:
    - selinux
    - intel_gpu

- name: Include longhorn tasks
  ansible.builtin.import_tasks:
    file: longhorn.yaml
  when:
    - hostvars[inventory_hostname].longhorn is defined
    - hostvars[inventory_hostname].longhorn | bool
  tags: longhorn
