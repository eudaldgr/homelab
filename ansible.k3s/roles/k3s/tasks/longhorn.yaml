- name: Check if /dev/sdb exists # noqa: var-naming
  ansible.builtin.stat:
    path: /dev/sdb
  register: longhorn_sdb_device
  tags: longhorn

- name: Fail if /dev/sdb does not exist
  ansible.builtin.fail:
    msg: "Device /dev/sdb does not exist on this system"
  when: not longhorn_sdb_device.stat.exists
  tags: longhorn

- name: Check if /dev/sdb has a filesystem # noqa: var-naming
  ansible.builtin.command: blkid -o value -s TYPE /dev/sdb
  register: longhorn_sdb_filesystem
  failed_when: false
  changed_when: false
  tags: longhorn

- name: Check if /dev/sdb is mounted # noqa: var-naming
  ansible.builtin.command: findmnt -n -o TARGET /dev/sdb
  register: longhorn_sdb_mount
  failed_when: false
  changed_when: false
  tags: longhorn

- name: Display current /dev/sdb status
  ansible.builtin.debug:
    msg: |
      Device: /dev/sdb
      Filesystem: {{ longhorn_sdb_filesystem.stdout if longhorn_sdb_filesystem.stdout else 'none' }}
      Mounted at: {{ longhorn_sdb_mount.stdout if longhorn_sdb_mount.stdout else 'not mounted' }}
  tags: longhorn

- name: Create ext4 filesystem on /dev/sdb (only if no filesystem exists)
  community.general.filesystem:
    fstype: ext4
    dev: /dev/sdb
    opts: -L longhorn
  when: longhorn_sdb_filesystem.stdout == ""
  tags: longhorn

- name: Create Longhorn mount point directory
  ansible.builtin.file:
    path: /var/lib/longhorn
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: longhorn

- name: Mount /dev/sdb to /var/lib/longhorn
  ansible.posix.mount:
    path: /var/lib/longhorn
    src: /dev/sdb
    fstype: ext4
    opts: defaults
    state: mounted
  tags: longhorn

- name: Configure SELinux context for Longhorn directory
  community.general.sefcontext:
    target: "/var/lib/longhorn(/.*)?"
    setype: "container_file_t"
    state: present
    reload: true
  tags: selinux

- name: Apply SELinux context to Longhorn directory
  ansible.builtin.command: |
    restorecon -Rv /var/lib/longhorn
  changed_when: false
  tags: selinux
