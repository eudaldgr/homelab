---
ansible_become: true
ansible_become_method: sudo

pangolin_domain: "pangolin.eudald.gr"
base_domains:
  - "eudald.gr"

pangolin_email: true
smtp_host: "{{ secret_pangolin_smtp_host }}"
smtp_port: 465
smtp_user: "{{ secret_pangolin_smtp_user }}"
smtp_pass: "{{ secret_pangolin_smtp_pass }}"
smtp_secure: true
no_reply_email: "{{ secret_pangolin_smtp_no_reply_email }}"

letsencrypt_mail: "{{ secret_pangolin_traefik_letsencrypt_mail }}"

pangolin_server_secret: "{{ secret_pangolin_server_secret }}"

pangolin_crowdsec_lapi_key: "{{ secret_pangolin_crowdsec_lapi_key }}"
