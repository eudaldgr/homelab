---
services:
  app:
    image: docker.io/adguard/adguardhome:v0.107.71@sha256:92929135ced2554aaf94706f766a98ad348f211df61b0704e2db7e8498cc00b7
    container_name: adguard_app_1
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/config:/opt/adguardhome/conf
      - ${APP_DATA_DIR}/data:/opt/adguardhome/work
    # command: ["--web-addr", "0.0.0.0:${ADGUARD_WEB_PORT}"]
    ports:
      # DNS Ports
      - "53:53/udp"
      - "53:53/tcp"
      # Optional: DHCP Port
      # - "67:67/udp"
      # - "68:68/tcp"
      # - "68:68/udp"
      # Initial Setup Port
      # - "3000:3000/tcp"
      # Web Interface Port
      # If using network_mode: host, AdGuard listens on port 80 by default.
      # You may need to change it to 8053 in AdGuardHome.yaml or via command: ["--web-addr", "0.0.0.0:8053"]
      - "${ADGUARD_WEB_PORT:-3000}:${ADGUARD_WEB_PORT:-3000}/tcp"
      # Optional: HTTPS/DNS-over-HTTPS Port
      # - "443:443/tcp"
      # Optional: DNS-over-TLS Port
      # - "853:853/tcp"
      # Optional: DNS-over-QUIC Port
      # - "784:784/udp"
      # - "853:853/udp"
      # - "8853:8853/udp"
      # Optional: DNSCrypt Port
      # - "5443:5443/tcp"
      # - "5443:5443/udp"
    networks:
      vlan20:
        ipv4_address: 10.1.20.5
    restart: unless-stopped

networks:
  vlan20:
    name: vlan20
    driver: macvlan
    driver_opts:
      parent: eth2.20
    ipam:
      config:
        - subnet: 10.1.20.0/24
          gateway: 10.1.20.1
