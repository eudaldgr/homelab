name: speedtest

services:
  chown:
    image: ghcr.io/vegops/chown:latest
    container_name: speedtest_chown_1
    volumes:
      - ${APP_DATA_DIR}/data:/chown
    command: "-R 65532:65532 /chown"

  tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.14.3@sha256:c3750c40948a9360000ce62d694da92e85584b4ab6d3d9a9d1432d76fa5e0726
    container_name: speedtest_tracker_1
    depends_on:
      chown:
        condition: service_completed_successfully
    ports:
      - 8080:80
      - 8443:443
    environment:
      - PUID=65532
      - PGID=65532
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=sqlite

      - APP_TIMEZONE=${TZ}
      - DISPLAY_TIMEZONE=${TZ}
      - SPEEDTEST_SCHEDULE=0 * * * *
    volumes:
      - ${APP_DATA_DIR}/data/etc:/config
      - ${APP_DATA_DIR}/data/keys:/config/keys
    restart: unless-stopped
