[[stack]]
name = "speedtest"
description = "Stack Speedtest"
deploy = true
tags = ["prod"]

[stack.config]
server_id = "ds920plus"
linked_repo = "homelab"
run_directory = "compose/ds920plus/prod/speedtest"
auto_pull = true
send_alerts = true
ignore_services = ["chown"]

compose_cmd_wrapper = """
/opt/sops exec-env compose.env '[[COMPOSE_COMMAND]]'"""