name: omada

services:
  chown:
    image: ghcr.io/vegops/chown:latest
    container_name: omada_chown_1
    volumes:
      - ${APP_DATA_DIR}/omada:/chown
    command: "-R 65532:65532 /chown"

  controller:
    image: docker.io/mbentley/omada-controller:5.15.24.19-openj9@sha256:f3fe51600afc76857aeb51877dbea516a8f1d913bf62f6fb203382e733e61663
    container_name: omada_controller_1
    depends_on:
      chown:
        condition: service_completed_successfully
    user: 65532:65532
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 60s
    environment:
      - ROOTLESS=true
      - MANAGE_HTTP_PORT=8088
      - MANAGE_HTTPS_PORT=8043
      - PORTAL_HTTP_PORT=8088
      - PORTAL_HTTPS_PORT=8843
      - UPGRADE_HTTPS_PORT=8043
      - PORT_APP_DISCOVERY=27001
      - PORT_DISCOVERY=29810
      - PORT_MANAGER_V1=29811
      - PORT_ADOPT_V1=29812
      - PORT_UPGRADE_V1=29813
      - PORT_MANAGER_V2=29814
      - PORT_TRANSFER_V2=29815
      - PORT_RTTY=29816
      - PORT_DEVICE_MONITOR=29817
      - WEB_CONFIG_OVERRIDE=false
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
      - SSL_CERT_NAME=tls.crt
      - SSL_KEY_NAME=tls.key
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/omada/data:/opt/tplink/EAPController/data
      - ${APP_DATA_DIR}/omada/logs:/opt/tplink/EAPController/logs
    networks:
      vlan99:
        ipv4_address: 10.1.99.10
    restart: unless-stopped

networks:
  vlan99:
    external: true
