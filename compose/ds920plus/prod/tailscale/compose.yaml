name: tailscale

services:
  app:
    image: docker.io/tailscale/tailscale:v1.98.4@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0
    container_name: tailscale_app_1
    environment:
      - TZ=${TZ}
      - TS_NO_LOGS_NO_SUPPORT=true # https://tailscale.com/kb/1011/log-mesh-traffic?tab=linux#opt-out-of-client-logging
    command: >
      sh -c '
        tailscaled --tun=userspace-networking &
        TS_PID=$!
        sleep 5
        tailscale up --reset
        tailscale web --listen=0.0.0.0:8240 &
        wait $TS_PID
      '
    volumes:
      - ${APP_DATA_DIR}/tailscale/var:/var/lib/tailscale
    network_mode: host
    restart: unless-stopped
