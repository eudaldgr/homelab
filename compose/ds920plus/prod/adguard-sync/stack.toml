[[stack]]
name = "adguard-sync-ds920plus"
description = "Stack AdGuard Home Sync"
deploy = true
tags = ["ds920plus", "prod"]

[stack.config]
server_id = "ds920plus"
linked_repo = "homelab-ds920plus"
run_directory = "compose/ds920plus/prod/adguard-sync"
auto_pull = true
send_alerts = true

compose_cmd_wrapper = """
/opt/sops exec-env compose.env '[[COMPOSE_COMMAND]]'"""