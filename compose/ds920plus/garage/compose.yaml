name: garage

services:
  chown:
    image: ghcr.io/vegops/chown:latest
    container_name: garage_chown_1
    volumes:
      - ${S3_DATA_DIR}/garage:/chown
    command: "-R 65532:65532 /chown"

  app:
    image: ghcr.io/vegops/garage:2.3.0-r0@sha256:2529a9d4715b05ded8a7d475d8494e8d83b2e2a013538940a8633806a7f86584
    container_name: garage_app_1
    user: 65532:65532
    depends_on:
      chown:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:?Missing TZ}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Missing GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Missing GARAGE_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "/usr/bin/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - ${S3_DATA_DIR}/garage/etc:/garage/etc
      - ${S3_DATA_DIR}/garage/var:/garage/var
    ports:
      - 3900:3900
    restart: unless-stopped

  webui:
    image: ghcr.io/vegops/garage-webui:1.1.0-r0@sha256:dc63b352d45acc55209ec13f1092a2ee3fcb0baa87717a575dfe1bdcdf7c9297
    container_name: garage_webui_1
    depends_on:
      app:
        condition: service_healthy
    environment:
      CONFIG_PATH: /tmp/missing.toml
      API_BASE_URL: http://app:3903
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:?Missing GARAGE_ADMIN_TOKEN}
      S3_REGION: garage
      S3_ENDPOINT_URL: http://app:3900
    ports:
      - 3909:3909
    tmpfs:
      - /tmp
    restart: unless-stopped
