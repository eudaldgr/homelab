name: arr

x-lockdown: &lockdown
  security_opt:
    - "no-new-privileges=true"

x-chown: &chown
  depends_on:
    chown:
      condition: service_completed_successfully

x-restart: &restart
  restart: unless-stopped

services:
  chown:
    image: ghcr.io/vegops/chown:latest
    container_name: arr_chown_1
    volumes:
      - ${APP_DATA_DIR}/arr:/chown/arr
      - ${MEDIA_DATA_DIR:-/}:/chown/media
    command: "-R 65532:65532 /chown"

  radarr:
    image: ghcr.io/vegops/radarr:latest
    <<: [*lockdown, *chown, *restart]
    container_name: arr_radarr_1
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/arr/radarr:/radarr/data
      - ${MEDIA_DATA_DIR:-/}:/data
    ports:
      - 7878:7878
    labels:
      # Public Resource Configuration
      - pangolin.public-resources.radarr.name=radarr
      - pangolin.public-resources.radarr.full-domain=${RADARR_HOSTNAME}
      - pangolin.public-resources.radarr.protocol=http
      # Auth: protect all but API
      - pangolin.public-resources.radarr.auth.sso-enabled=true
      - pangolin.public-resources.radarr.rules[0].action=allow
      - pangolin.public-resources.radarr.rules[0].match=path
      - pangolin.public-resources.radarr.rules[0].value=/api/*
      # Target Configuration - Override to Host Hairpin
      - pangolin.public-resources.radarr.targets[0].method=http
      - pangolin.public-resources.radarr.targets[0].hostname=127.0.0.1
      - pangolin.public-resources.radarr.targets[0].port=7878
      # Health Check Configuration
      - pangolin.public-resources.radarr.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.radarr.targets[0].healthcheck.hostname=127.0.0.1
      - pangolin.public-resources.radarr.targets[0].healthcheck.port=7878
      - pangolin.public-resources.radarr.targets[0].healthcheck.path=/

  sonarr:
    image: ghcr.io/vegops/sonarr:latest
    <<: [*lockdown, *chown, *restart]
    container_name: arr_sonarr_1
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/arr/sonarr:/sonarr/data
      - ${MEDIA_DATA_DIR:-/}:/data
    ports:
      - 8989:8989
    labels:
      # Public Resource Configuration
      - pangolin.public-resources.sonarr.name=sonarr
      - pangolin.public-resources.sonarr.full-domain=${SONARR_HOSTNAME}
      - pangolin.public-resources.sonarr.protocol=http
      # Auth: protect all but API
      - pangolin.public-resources.sonarr.auth.sso-enabled=true
      - pangolin.public-resources.sonarr.rules[0].action=allow
      - pangolin.public-resources.sonarr.rules[0].match=path
      - pangolin.public-resources.sonarr.rules[0].value=/api/*
      # Target Configuration - Override to Host Hairpin
      - pangolin.public-resources.sonarr.targets[0].method=http
      - pangolin.public-resources.sonarr.targets[0].hostname=127.0.0.1
      - pangolin.public-resources.sonarr.targets[0].port=8989
      # Health Check Configuration
      - pangolin.public-resources.sonarr.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.sonarr.targets[0].healthcheck.hostname=127.0.0.1
      - pangolin.public-resources.sonarr.targets[0].healthcheck.port=8989
      - pangolin.public-resources.sonarr.targets[0].healthcheck.path=/

  lidarr:
    image: ghcr.io/vegops/lidarr:latest
    <<: [*lockdown, *chown, *restart]
    container_name: arr_lidarr_1
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/arr/lidarr:/lidarr/data
      - ${MEDIA_DATA_DIR:-/}:/data
    ports:
      - 8686:8686
    labels:
      # Public Resource Configuration
      - pangolin.public-resources.lidarr.name=lidarr
      - pangolin.public-resources.lidarr.full-domain=${LIDARR_HOSTNAME}
      - pangolin.public-resources.lidarr.protocol=http
      # Auth: protect all but API
      - pangolin.public-resources.lidarr.auth.sso-enabled=true
      - pangolin.public-resources.lidarr.rules[0].action=allow
      - pangolin.public-resources.lidarr.rules[0].match=path
      - pangolin.public-resources.lidarr.rules[0].value=/api/*
      # Target Configuration - Override to Host Hairpin
      - pangolin.public-resources.lidarr.targets[0].method=http
      - pangolin.public-resources.lidarr.targets[0].hostname=127.0.0.1
      - pangolin.public-resources.lidarr.targets[0].port=8686
      # Health Check Configuration
      - pangolin.public-resources.lidarr.targets[0].healthcheck.enabled=true
      - pangolin.public-resources.lidarr.targets[0].healthcheck.hostname=127.0.0.1
      - pangolin.public-resources.lidarr.targets[0].healthcheck.port=8686
      - pangolin.public-resources.lidarr.targets[0].healthcheck.path=/

  #  bazarr:
  #    image: lscr.io/linuxserver/bazarr:latest
  #    container_name: arr_bazarr_1
  #    environment:
  #      - TZ=${TZ}
  #    volumes:
  #      - ${APP_DATA_DIR}/arr/bazarr:/config
  #      - ${MEDIA_DATA_DIR:-/}/media:/data/media
  #    ports:
