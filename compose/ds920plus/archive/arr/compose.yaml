  # readarr:
  #   image: lscr.io/linuxserver/readarr:develop
  #   container_name: arr_readarr_1
  #   environment:
  #     - TZ=${TZ}
  #   volumes:
  #     - ${APP_DATA_DIR}/arr/readarr:/config
