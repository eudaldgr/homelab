[[stack]]
name = "newt"
description = "Stack Newt"
deploy = true

[stack.config]
server_id = "ds920plus"
linked_repo = "homelab"
run_directory = "compose/ds920plus/newt"
auto_pull = true
send_alerts = true

environment = """
APP_DATA_DIR=[[APP_DATA_DIR]]
"""

compose_cmd_wrapper_include = ["config", "pull", "up"]
compose_cmd_wrapper = """
[[INFISICAL_RUN]] \
  --projectId='[[INFISICAL_PROJECT_ID]]' \
  --env=prod \
  --path=/compose/ds920plus/newt \
  --command '[[COMPOSE_COMMAND]]'"""