---
services:
  tracker:
    image: lscr.io/linuxserver/speedtest-tracker:1.13.4@sha256:d3a733cb62b67866fcae7d8e982feeeee48635dc09a5ecf730c37088de55803c
    container_name: speedtest_tracker_1
    user: "0:0"
    userns_mode: "keep-id"
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - 8080:80
      - 8443:443
    environment:
      - PUID=911
      - PGID=911
      - TZ=${TZ}
      - DISPLAY_TIMEZONE=${TZ}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=0 * * * *
    volumes:
      - ${APP_DATA_DIR}/speedtest/data/conf:/config
      - ${APP_DATA_DIR}/speedtest/data/keys:/config/keys
    restart: unless-stopped
