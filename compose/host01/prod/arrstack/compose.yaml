    user: "${LSCR_UID}:${LSCR_GID}"
    userns_mode: "keep-id:uid=${LSCR_UID},gid=${LSCR_GID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_DATA_DIR}/media:/data/media
      - ${APP_DATA_DIR}/arrstack/plex:/config
    ports:
      - 32400:32400
      # Plex Companion
      - 3005:3005/tcp
      # Roku via Plex Companion
      - 8324:8324/tcp
      # Plex DLNA Server
      - 32469:32469/tcp
      - 1900:1900/udp
      # older Bonjour/Avahi network discovery
      - 5353:5353/udp
      # Network discovery
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    devices:
      - /dev/dri:/dev/dri
    labels:
      # Public Resource Configuration
      - pangolin.proxy-resources.plex.name=plex
      - pangolin.proxy-resources.plex.full-domain=${PLEX_HOSTNAME}
      - pangolin.proxy-resources.plex.protocol=http
      # Target Configuration - Override to Host Hairpin
