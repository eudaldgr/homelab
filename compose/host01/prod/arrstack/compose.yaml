---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4@sha256:6c0948b42c149e36bb3dbc0b64d36c77b2d3c9dccf1b424c4f72af1e57ba0c21
    container_name: arrstack_radarr_1
    user: "${LSCR_UID}:${LSCR_GID}"
    userns_mode: "keep-id:uid=${LSCR_UID},gid=${LSCR_GID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_DATA_DIR:-/}:/data
      - ${APP_DATA_DIR}/arrstack/radarr:/config
    ports:
      - 7878:7878
    labels:
      # Public Resource Configuration
      - pangolin.proxy-resources.radarr.name=radarr
      - pangolin.proxy-resources.radarr.full-domain=${RADARR_HOSTNAME}
      - pangolin.proxy-resources.radarr.protocol=http
      # Auth: protect all but API
      - pangolin.proxy-resources.radarr.auth.sso-enabled=true
      - pangolin.proxy-resources.radarr.rules[0].action=allow
      - pangolin.proxy-resources.radarr.rules[0].match=path
      - pangolin.proxy-resources.radarr.rules[0].value=/api/*
      # Target Configuration - Override to Host Hairpin
      - pangolin.proxy-resources.radarr.targets[0].method=http
      - pangolin.proxy-resources.radarr.targets[0].hostname=host.containers.internal
      - pangolin.proxy-resources.radarr.targets[0].port=7878
      # Health Check Configuration
      - pangolin.proxy-resources.radarr.targets[0].healthcheck.enabled=true
      - pangolin.proxy-resources.radarr.targets[0].healthcheck.hostname=host.containers.internal
      - pangolin.proxy-resources.radarr.targets[0].healthcheck.port=7878
      - pangolin.proxy-resources.radarr.targets[0].healthcheck.path=/
    restart: unless-stopped

