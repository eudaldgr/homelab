[[stack]]
name = "zerobyte-host01"
description = "Stack Zerobyte"
deploy = true
tags = ["host01", "prod"]

[stack.config]
server_id = "host01"
linked_repo = "homelab-host01"
run_directory = "compose/host01/prod/zerobyte"
auto_pull = true
send_alerts = true

compose_cmd_wrapper = """
/opt/sops exec-env compose.env '[[COMPOSE_COMMAND]]'"""