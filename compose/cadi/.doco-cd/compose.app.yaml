---
# This file is copied by Ansible because doco-cd cannot manage itself.
name: doco-cd
secrets:
  infisical_client_secret:
    file: /opt/doco-cd/infisical_client_secret
  api_secret:
    file: /opt/doco-cd/api_secret
  webhook_secret:
    file: /opt/doco-cd/webhook_secret
services:
  app:
    image: ghcr.io/kimdre/doco-cd:0.118.0@sha256:8a1d8ba96a90af2d7bcd8e9ae5f0ef4c99835e28167b3d566ebbb86a8e65c053
    container_name: doco-cd
    environment:
      API_SECRET_FILE: /run/secrets/api_secret
      DEPLOY_CONFIG_BASE_DIR: ./compose/cadi/
      HTTP_PORT: 8880
      LOG_LEVEL: info
      POLL_CONFIG: |-
        - url: https://github.com/eudaldgr/homelab.git
          reference: main
          interval: 3600
      SECRET_PROVIDER: infisical
      SECRET_PROVIDER_SITE_URL: https://eu.infisical.com
      SECRET_PROVIDER_CLIENT_ID: ${INFISICAL_CLIENT_ID}
      SECRET_PROVIDER_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
      TZ: Europe/Madrid
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    healthcheck:
      test:
        - CMD
        - /doco-cd
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    secrets:
      - infisical_client_secret
      - api_secret
      - webhook_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - var:/data
    restart: unless-stopped
volumes:
  var:
networks:
  default:
    name: edge
    external: true
