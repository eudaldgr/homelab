#cloud-config
hostname: ${hostname}
timezone: ${timezone}

# Create needed directories before write_files runs
bootcmd:
  - mkdir -p /opt/rootless/homelab/pangolin/config/{traefik,db,letsencrypt,logs}
  - mkdir -p /opt/rootless/homelab/pangolin/quadlets
  - mkdir -p /etc/rebootmgr.conf.d
  - mkdir -p /etc/transactional-update.conf.d
  - mkdir -p /opt/rootless/.config/systemd/user/default.target.wants
  - mkdir -p /opt/rootless/.config/containers/systemd

# Setup system configuration
write_files:
  # .bashrc for rootless user
  - content: |
      export XDG_CONFIG_HOME=$HOME/.config
      export XDG_RUNTIME_DIR=/run/user/$(id -u)
      export DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock
      export PODMAN_COMPOSE_WARNING_LOGS=0
    path: /opt/rootless/.bashrc
    append: true

  # UID/GID ranges for rootless user
  - content: |
      rootless:300000:65536
    path: /etc/subuid
    permissions: '0644'
    append: true
    
  - content: |
      rootless:300000:65536
    path: /etc/subgid
    permissions: '0644'
    append: true
  
  # Podman configuration
  - content: |
      [containers]
      events_logger = "journald"
    path: /etc/containers/containers.conf
    permissions: '0644'
    
  - content: |
      [rebootmgr]
      window-start=02:00
      window-duration=6h
      strategy=best-effort
    path: /etc/rebootmgr.conf.d/50-homelab.conf
    permissions: '0644'

  - content: |
      REBOOT_METHOD=rebootmgr
    path: /etc/transactional-update.conf.d/50-reboot.conf
    permissions: '0644'
  
  - content: |
      net.ipv4.ip_unprivileged_port_start=0
      net.ipv4.ping_group_range=0 2000000
    path: /etc/sysctl.d/50-homelab.conf
    permissions: '0644'

  - content: |
      rtnl-link-wireguard
      net-pf-16-proto-16-family-wireguard
      nfnetlink-subsys-11
      nft-expr-target
      ipt_tcp
      ipt_TCPMSS
    path: /etc/modules-load.d/50-homelab.conf
    permissions: '0644'

  - content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 3
      
      [sshd]
      enabled = true
      port = 22
      filter = sshd
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 3600
    path: /etc/fail2ban/jail.local
    permissions: '0644'

  # Pangolin quadlets service
  - content: |
      [Unit]
      Description=Pangolin Service
      After=network.target

      [Container]
      Network=pangolin.network
      Image=docker.io/fosrl/pangolin:1.9.2@sha256:1ea3d070db5543eafd09f0b4c75bde9eb12c30a216bc3915950ef807235674e8
      ContainerName=pangolin_app_1
      Volume=$${APP_DATA_DIR}/config:/app/config:z
      HealthCmd=curl -f http://localhost:3001/api/v1/
      HealthInterval=3s
      HealthTimeout=3s
      HealthRetries=15

      [Service]
      Environment=APP_DATA_DIR=%h/homelab/pangolin
      Restart=always

      [Install]
      WantedBy=default.target
    path: /opt/rootless/homelab/pangolin/quadlets/pangolin_app_1.container
    permissions: '0644'
  
  - content: |
      [Unit]
      Description=Gerbil Service
      After=pangolin_app_1.service network.target
      Requires=pangolin_app_1.service

      [Container]
      Network=pangolin.network
      Image=docker.io/fosrl/gerbil:1.2.1@sha256:52888961717c027bfc9ddea4dd55f57fd54d326fb1a9f9959e9d47e7500ad418
      ContainerName=pangolin_gerbil_1
      Volume=$${APP_DATA_DIR}/config:/var/config:z
      AddCapability=CAP_NET_ADMIN CAP_NET_RAW CAP_SYS_MODULE
      PublishPort=51820:51820/udp
      PublishPort=21820:21820/udp
      Exec=--reachableAt=http://pangolin_gerbil_1:3003 --generateAndSaveKeyTo=/var/config/key --remoteConfig=http://pangolin_app_1:3001/api/v1/gerbil/get-config --reportBandwidthTo=http://pangolin_app_1:3001/api/v1/gerbil/receive-bandwidth

      [Service]
      Environment=APP_DATA_DIR=%h/homelab/pangolin
      Restart=always

      [Install]
      WantedBy=default.target
    path: /opt/rootless/homelab/pangolin/quadlets/pangolin_gerbil_1.container
    permissions: '0644'
  
  - content: |
      [Network]
      Label=app=pangolin
    path: /opt/rootless/homelab/pangolin/quadlets/pangolin.network
    permissions: '0644'

  - content: |
      [Unit]
      Description=Traefik Reverse Proxy
      After=pangolin_app_1.service pangolin_gerbil_1.service network.target
      Requires=pangolin_app_1.service pangolin_gerbil_1.service

      [Container]
      Image=docker.io/library/traefik:v3.5.1@sha256:c56901603318ee375477ee5c3f50d175d3ec42dc102efc2f1158f0756ba4dffa
      ContainerName=pangolin_traefik_1
      Network=pangolin.network
      Volume=$${APP_DATA_DIR}/config/traefik:/etc/traefik:ro,Z
      Volume=$${APP_DATA_DIR}/config/letsencrypt:/letsencrypt:Z
      Exec=--configFile=/etc/traefik/traefik_config.yml
      PublishPort=80:80
      PublishPort=443:443

      [Service]
      Environment=APP_DATA_DIR=%h/homelab/pangolin
      Restart=always

      [Install]
      WantedBy=default.target
    path: /opt/rootless/homelab/pangolin/quadlets/pangolin_traefik_1.container
    permissions: '0644'
  
  - content: |
      app:
        dashboard_url: "https://${pangolin_domain}"
        log_level: "info"
        telemetry:
          anonymous_usage: false

      domains:
        domain1:
          base_domain: "${base_domain}"
          cert_resolver: "letsencrypt"

      server:
        secret: "your-strong-secret"
        cors:
          origins: ["https://${pangolin_domain}"]
          methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
          allowed_headers: ["X-CSRF-Token", "Content-Type"]
          credentials: false

      gerbil:
        start_port: 51820
        base_endpoint: "${pangolin_domain}"

      email:
        smtp_host: "${smtp_host}"
        smtp_port: ${smtp_port}
        smtp_user: "${smtp_user}"
        smtp_pass: "${smtp_pass}"
        smtp_secure: ${smtp_secure}
        no_reply: "${no_reply_email}"

      flags:
        require_email_verification: false
        disable_signup_without_invite: true
        disable_user_create_org: true
        allow_raw_resources: true
    path: /opt/rootless/homelab/pangolin/config/config.yml
    permissions: '0644'
    
  - content: |
      api:
        insecure: true
        dashboard: true

      providers:
        http:
          endpoint: "http://pangolin_app_1:3001/api/v1/traefik-config"
          pollInterval: "5s"
        file:
          filename: "/etc/traefik/dynamic_config.yml"

      experimental:
        plugins:
          badger:
            moduleName: "github.com/fosrl/badger"
            version: "v1.2.0"

      log:
        level: "DEBUG"
        format: "common"
        maxSize: 100
        maxBackups: 3
        maxAge: 3
        compress: true

      certificatesResolvers:
        letsencrypt:
          acme:
            httpChallenge:
              entryPoint: web
            email: ${letsencrypt_mail} # REPLACE WITH YOUR EMAIL
            storage: "/letsencrypt/acme.json"
            caServer: "https://acme-v02.api.letsencrypt.org/directory"

      entryPoints:
        web:
          address: ":80"
        websecure:
          address: ":443"

          transport:
            respondingTimeouts:
              readTimeout: "30m"
          http:
            tls:
              certResolver: "letsencrypt"

      serversTransport:
        insecureSkipVerify: true

      ping:
          entryPoint: "web"
    path: /opt/rootless/homelab/pangolin/config/traefik/traefik_config.yml
    permissions: '0644'
    
  - content: |
      http:
        middlewares:
          redirect-to-https:
            redirectScheme:
              scheme: https

        routers:
          # HTTP to HTTPS redirect router
          main-app-router-redirect:
            rule: "Host(`${pangolin_domain}`)" # REPLACE WITH YOUR DOMAIN
            service: next-service
            entryPoints:
              - web
            middlewares:
              - redirect-to-https

          # Next.js router (handles everything except API and WebSocket paths)
          next-router:
            rule: "Host(`${pangolin_domain}`) && !PathPrefix(`/api/v1`)" # REPLACE WITH YOUR DOMAIN
            service: next-service
            entryPoints:
              - websecure
            tls:
              certResolver: letsencrypt

          # API router (handles /api/v1 paths)
          api-router:
            rule: "Host(`${pangolin_domain}`) && PathPrefix(`/api/v1`)" # REPLACE WITH YOUR DOMAIN
            service: api-service
            entryPoints:
              - websecure
            tls:
              certResolver: letsencrypt

          # WebSocket router
          ws-router:
            rule: "Host(`${pangolin_domain}`)" # REPLACE WITH YOUR DOMAIN
            service: api-service
            entryPoints:
              - websecure
            tls:
              certResolver: letsencrypt

        services:
          next-service:
            loadBalancer:
              servers:
                - url: "http://pangolin_app_1:3002" # Next.js server

          api-service:
            loadBalancer:
              servers:
                - url: "http://pangolin_app_1:3000" # API/WebSocket server
    path: /opt/rootless/homelab/pangolin/config/traefik/dynamic_config.yml
    permissions: '0644'

# Create users
users:
  - name: eudaldgr
    groups: [sudo, systemd-journal, users]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_authorized_keys}
  - name: rootless
    system: true
    homedir: /opt/rootless
    shell: /bin/bash
    groups: [systemd-journal]

# Create directories and setup
runcmd:
  - until systemctl is-active --quiet network-online.target; do sleep 1; done
  - transactional-update --non-interactive --continue dist-upgrade
  - |
    transactional-update --continue pkg install -y \
        curl \
        wget \
        podman \
        fuse-overlayfs \
        passt \
        systemd-container \
        libcap2 \
        fail2ban \
        iptables
  - transactional-update --non-interactive --continue setup-selinux
  - transactional-update --continue run bash -c 'echo "-F" > /etc/selinux/.autorelabel'
  - |
    transactional-update --continue run bash -c '
        systemctl enable fail2ban
        systemctl enable rebootmgr
        systemctl enable transactional-update.timer
        systemctl disable podman.socket

        # Symlink podman.socket so user services can use it
        ln -sf /usr/lib/systemd/user/podman.socket \
            /opt/rootless/.config/systemd/user/default.target.wants/podman.socket

        # Symlink all pangolin quadlets
        for file in /opt/rootless/homelab/pangolin/quadlets/pangolin*; do
          basefile=$(basename $file)
          ln -sf $file /opt/rootless/.config/containers/systemd/$basefile
        done
    '
  - chown -R rootless:rootless /opt/rootless
  - loginctl enable-linger rootless

# SSH hardening
ssh_pwauth: false
disable_root: true

power_state:
  mode: reboot
  timeout: 30
  condition: true
