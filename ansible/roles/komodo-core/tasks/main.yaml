- name: Restart Komodo Mongo if needed
  ansible.builtin.systemd_service:
    name: komodo_mongo_1.service
    state: restarted
    enabled: true
  when: komodo_mongo_quadlet.changed
    or komodo_network.changed
    or komodo_files.changed
  tags: komodo

- name: Restart Komodo Core if needed
  ansible.builtin.systemd_service:
    name: komodo_core_1.service
    state: restarted
    enabled: true
  when: komodo_core_quadlet.changed
    or komodo_network.changed
    or komodo_files.changed
  tags: komodo

- name: Include Komodo key generation tasks
  ansible.builtin.include_tasks: keys.yaml
  tags: [komodo, keys]
