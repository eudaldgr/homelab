---
- name: Create override.conf for podman-restart.service
  ansible.builtin.blockinfile:
    path: "/etc/systemd/system/podman-restart.service.d/override.conf"
    block: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/podman $LOGGING start --all --filter restart-policy=always --filter restart-policy=unless-stopped
      ExecStop=
      ExecStop=/bin/sh -c '\
        /usr/bin/podman $LOGGING stop $(
          /usr/bin/podman container ls \
            --filter restart-policy=always \
            --filter restart-policy=unless-stopped -q
        )'
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Podman restart service override"
    create: true
    owner: root
    group: root
    mode: "0644"
  tags: podman

- name: Start and enable podman services
  ansible.builtin.systemd_service:
    name: podman-restart.service
    state: restarted
    enabled: true
  changed_when: false
  tags: podman

- name: Include SOPS age setup tasks
  ansible.builtin.include_tasks: sops.yaml
  tags:
    - sops
    - age
