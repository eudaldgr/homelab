---
- name: Disable root user
  ansible.builtin.user:
    name: root
    password_lock: true
    state: present
  tags: user

- name: Disable SSH password authentication
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-homelab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
    validate: "sshd -t -f %s"
  notify: Restart ssh service
  tags: ssh

- name: Create rootless group
  ansible.builtin.group:
    name: "{{ rootless_user }}"
    system: true
  tags: user

- name: Create rootless user
  ansible.builtin.user:
    name: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    groups: systemd-journal
    shell: /bin/bash
    home: "/home/{{ rootless_user }}"
    system: true
    state: present
  tags: user

- name: Add ansible_user to the rootless group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ rootless_user }}"
    append: true
    state: present
  tags: user

- name: Setting subuid and subgid
  ansible.builtin.blockinfile:
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Default"
    content: |
      {{ rootless_user }}:300000:65536
  with_items:
    - /etc/subuid
    - /etc/subgid
  tags: user

- name: Update all packages
  community.general.zypper:
    name: "*"
    state: latest
  register: update
  tags: update

- name: Unconditionally reboot the machine with all defaults
  ansible.builtin.reboot:
  when: update.changed # noqa: no-handler
  tags: reboot

- name: Install base packages
  community.general.zypper:
    name:
      - nfs-utils
      - curl
      - wget
      - podman
      - podman-compose
      - fuse-overlayfs
      - passt
      - systemd-container
      - libcap2
      - fail2ban
      - udica
      - iptables
    state: present
  register: packages
  tags: packages

- name: Unconditionally reboot the machine with all defaults
  ansible.builtin.reboot:
  when: packages.changed # noqa: no-handler
  tags: reboot

- name: Create containers.conf
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [containers]
      events_logger = "journald"
  tags: podman

- name: Ensure create directories for rebootmgr and transactional-update
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/rebootmgr.conf.d
    - /etc/transactional-update.conf.d
  tags: system

- name: Create rebootmgr configuration
  ansible.builtin.copy:
    dest: /etc/rebootmgr.conf.d/50-homelab.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [rebootmgr]
      window-start=02:00
      window-duration=6h
      strategy=best-effort
  tags: system

- name: Configure transactional-update to use rebootmgr
  ansible.builtin.copy:
    dest: /etc/transactional-update.conf.d/50-reboot.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      REBOOT_METHOD=rebootmgr
  tags: system

- name: Enable IPv4 unprivileged port start to 0
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "0"
    state: present
    reload: true
  tags: sysctl

- name: Enable IPv4 ping group range
  ansible.posix.sysctl:
    name: net.ipv4.ping_group_range
    value: "0 2000000"
    state: present
    reload: true
  tags: sysctl

- name: Enable iptables modprobe
  ansible.builtin.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - ip_tables
    - ip6_tables
    - rtnl-link-wireguard
    - net-pf-16-proto-16-family-wireguard
    - nfnetlink-subsys-11
    - nft-expr-target
    - ipt_tcp
    - ipt_TCPMSS
  tags: system

- name: Ensure SELinux is set
  ansible.builtin.command: |
    transactional-update --non-interactive --continue setup-selinux
  changed_when: false
  tags: selinux

- name: Ensure SELinux is set to enforcing
  ansible.builtin.command: |
    transactional-update --continue run bash -c 'echo "-F" > /etc/selinux/.autorelabel'
  changed_when: false
  tags: selinux

- name: Unconditionally reboot the machine with all defaults
  ansible.builtin.reboot:
  tags: reboot

- name: Start and enable services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - fail2ban
    - rebootmgr
    - transactional-update.timer
  tags: services

- name: Disable podman.socket
  ansible.builtin.systemd_service:
    name: podman.socket
    state: stopped
    enabled: false
  tags: services

- name: Create a directory if it does not exist
  ansible.builtin.file:
    path: /var/lib/containers/user/{{ rootless_user }}/storage
    state: directory
    mode: "0700"
  tags: podman

- name: Ensure correct permissions on /var/lib/containers
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0711"
  loop:
    - /var/lib/containers
    - /var/lib/containers/user
  tags: podman

- name: Ensure correct ownership and permissions on /var/lib/containers/user/{{ rootless_user }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0700"
  with_items:
    - /var/lib/containers/user/{{ rootless_user }}
    - /var/lib/containers/user/{{ rootless_user }}/storage
  tags: podman

- name: Afegir/actualitzar mappings SELinux
  community.general.sefcontext:
    target: "{{ item.target }}"
    setype: "{{ item.setype }}"
    state: present
    reload: true
  loop:
    - target: "/var/lib/containers/user/[^/]+/storage/overlay(/.*)?"
      setype: "container_ro_file_t"
    - target: "/var/lib/containers/user/[^/]+/storage/overlay2(/.*)?"
      setype: "container_ro_file_t"
    - target: "/var/lib/containers/user/[^/]+/storage/overlay2-images(/.*)?"
      setype: "container_ro_file_t"
    - target: "/var/lib/containers/user/[^/]+/storage/overlay2-layers(/.*)?"
      setype: "container_ro_file_t"
    - target: "/var/lib/containers/user/[^/]+/storage/overlay-layers(/.*)?"
      setype: "container_ro_file_t"
    - target: "/var/lib/containers/user/[^/]+/storage/overlay-images(/.*)?"
      setype: "container_ro_file_t"
    - target: "/var/lib/containers/user/[^/]+/storage/volumes/[^/]*/.*"
      setype: "container_file_t"
  tags: selinux

- name: Restorecon recursiu i forçat sobre /var/lib/containers/user
  ansible.builtin.command: |
    restorecon -RvF /var/lib/containers/user
  changed_when: false
  tags: selinux

- name: Create mount point directory if it doesn't exist
  ansible.builtin.command: |
    transactional-update --continue run bash -c '
      mkdir -p "{{ nfs_mount_point | default('/mnt/nfs') }}" &&
      chown root:root "{{ nfs_mount_point | default('/mnt/nfs') }}" &&
      chmod 0755 "{{ nfs_mount_point | default('/mnt/nfs') }}"'
  when: nfs_server is defined and nfs_path is defined
  changed_when: false
  tags: nfs

- name: Unconditionally reboot the machine with all defaults
  ansible.builtin.reboot:
  tags: reboot

- name: Mount NFS share
  ansible.builtin.mount:
    src: "{{ nfs_server }}:{{ nfs_path }}"
    path: "{{ nfs_mount_point | default('/mnt/nfs') }}"
    fstype: nfs
    opts: "{{ nfs_options | default('nofail,x-systemd.automount,x-systemd.requires=network-online.target,x-systemd.mount-timeout=10s') }}"
    state: mounted
  when: nfs_server is defined and nfs_path is defined
  register: nfs_mount
  tags: nfs

- name: Change ownership of NFS mount point
  ansible.builtin.file:
    path: "{{ nfs_mount_point | default('/mnt/nfs') }}"
    state: directory
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0755"
    recurse: true
  when:
    - nfs_server is defined
    - nfs_path is defined
    - nfs_mount is succeeded
  tags: nfs

- name: Create directory for secrets on NFS share
  ansible.builtin.file:
    path: "{{ nfs_mount_point | default('/mnt/nfs') }}/secrets"
    state: directory
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0700"
  when:
    - nfs_server is defined
    - nfs_path is defined
    - nfs_mount is succeeded
  tags: nfs, podman

- name: Symlink secrets directory to podman storage
  ansible.builtin.file:
    src: "{{ nfs_mount_point | default('/mnt/nfs') }}/secrets"
    dest: "/var/lib/containers/user/{{ rootless_user }}/storage/secrets"
    state: link
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0700"
    force: true
  when:
    - nfs_server is defined
    - nfs_path is defined
    - nfs_mount is succeeded
  tags: nfs, podman

- name: Append .bashrc for user -> {{ rootless_user }}
  ansible.builtin.blockinfile:
    path: "/home/{{ rootless_user }}/.bashrc"
    block: |
      export XDG_CONFIG_HOME=$HOME/.config
      export XDG_RUNTIME_DIR=/run/user/$(id -u)
      export DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock
      export PODMAN_COMPOSE_WARNING_LOGS=0
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Podman config"
    create: true
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0644"
  tags: user, podman

- name: Create containers storage.conf
  ansible.builtin.blockinfile:
    path: "/home/{{ rootless_user }}/.config/containers/storage.conf"
    block: |
      [storage]
      driver = "overlay"
      rootless_storage_path = "/var/lib/containers/user/{{ rootless_user }}/storage"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Storage config"
    create: true
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0644"
  tags: user, podman

- name: Enable Linger for user -> {{ rootless_user }}
  ansible.builtin.command:
    argv: [/usr/bin/loginctl, enable-linger, "{{ rootless_user }}"]
    creates: "/var/lib/systemd/linger/{{ rootless_user }}"
  tags: system

- name: Get UID of {{ rootless_user }}
  ansible.builtin.command:
    argv: ["/usr/bin/id", "-u", "{{ rootless_user }}"]
  register: rootless_uid
  changed_when: false
  tags: user

- name: Ensure directory exists -> /run/user/{{ rootless_uid.stdout | trim }}
  ansible.builtin.file:
    path: "/run/user/{{ rootless_uid.stdout | trim }}"
    state: directory
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0700"
  tags: user, podman

- name: Start and enable podman.socket for user -> {{ rootless_user }}
  become: true
  become_method: community.general.machinectl # noqa: schema
  become_user: "{{ rootless_user }}"
  vars:
    ansible_pipelining: true
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ rootless_uid.stdout | trim }}"
  changed_when: false
  tags: user, podman
