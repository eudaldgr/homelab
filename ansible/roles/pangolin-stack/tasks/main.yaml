---
- name: Assegurar que els directoris necessaris existeixen
  ansible.builtin.file:
    path: "{{ dir_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containers/systemd
    - /etc/pangolin
    - /etc/pangolin/traefik
    - /etc/pangolin/letsencrypt
    - /etc/pangolin/traefik/logs
    - /etc/systemd/system
  loop_control:
    loop_var: dir_path
  tags: podman

- name: Copiar Pangolin quadlets
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ quadlet }}.container.j2"
    dest: "/etc/containers/systemd/{{ quadlet }}.container"
    owner: root
    group: root
    mode: "0644"
  register: pangolin_quadlets
  loop:
    - pangolin_app_1
    - pangolin_gerbil_1
    - pangolin_traefik_1
  loop_control:
    loop_var: quadlet
  tags: pangolin

- name: Copiar fitxers de configuració de Pangolin Stack
  ansible.builtin.template:
    src: "{{ role_path }}/templates/pangolin_proxy_1.pod.j2"
    dest: "/etc/containers/systemd/pangolin_proxy_1.pod"
    owner: root
    group: root
    mode: "0644"
  register: pangolin_pod
  tags: pangolin

- name: Check for existing Crowdsec API key
  ansible.builtin.shell: |
    set -o pipefail
    grep "crowdsecLapiKey:" /etc/pangolin/traefik/dynamic_config.yml | awk '{print $2}' | tr -d '"'
  register: existing_crowdsec_key
  failed_when: false
  changed_when: false
  when: pangolin_crowdsec
  tags: [pangolin, crowdsec]

- name: Copiar fitxers de configuració de Pangolin Stack
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item.name }}.j2"
    dest: "{{ item.dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  with_items:
    - name: config.yml
      dir: /etc/pangolin
    - name: dynamic_config.yml
      dir: /etc/pangolin/traefik
    - name: traefik_config.yml
      dir: /etc/pangolin/traefik
  register: pangolin_configs
  tags: pangolin

- name: Copiar fitxers de configuració de Pangolin Stack
  ansible.builtin.copy:
    src: "{{ role_path }}/files/pangolin_traefik_1.cil"
    dest: "/etc/pangolin/pangolin_traefik_1.cil"
    owner: root
    group: root
    mode: "0644"
  register: pangolin_traefik_selinux_policy
  tags: [pangolin, selinux]

- name: Check Pangolin Traefik SELinux policy installed
  ansible.builtin.command: semodule -l
  register: selinux_policy_check
  failed_when: false
  changed_when: false
  tags: [pangolin, selinux]

- name: Register Pangolin raw TCP ports with SELinux as http_port_t
  ansible.builtin.command:
    cmd: "semanage port -a -t http_port_t -p tcp {{ item }}"
  loop: "{{ pangolin_raw_tcp_ports }}"
  register: pangolin_semanage_register
  failed_when: false
  changed_when: pangolin_semanage_register.rc == 0
  when:
    - pangolin_raw_tcp_ports is defined
    - pangolin_raw_tcp_ports | length > 0
    - ansible_selinux is defined
    - ansible_selinux.status == 'enabled'
  tags: [pangolin, selinux]

- name: Install Pangolin Traefik SELinux policy # noqa: command-instead-of-shell
  ansible.builtin.shell: |
    semodule -i /etc/pangolin/pangolin_traefik_1.cil /usr/share/udica/templates/base_container.cil
  when: pangolin_traefik_selinux_policy.changed or 'pangolin_traefik_1' not in selinux_policy_check.stdout
  tags: [pangolin, selinux]

- name: Include GeoLite2 database tasks
  ansible.builtin.include_tasks: geolite2.yaml
  tags: [pangolin, geolite2]

- name: Include crowdsec tasks if enabled
  ansible.builtin.include_tasks: crowdsec.yaml
  when: pangolin_crowdsec
  tags: [pangolin, crowdsec]

- name: Reload systemd if Pangolin config changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: pangolin_quadlets.changed
    or pangolin_pod.changed
    or pangolin_configs.changed
  tags: pangolin

- name: Pull images for pangolin containers based on configured versions
  ansible.builtin.shell:
    cmd: |
      podman pull $(awk -F'=' '/^Image=/ {print $2}' /etc/containers/systemd/pangolin_*.container)
  changed_when: false
  tags: pangolin

- name: Stop pangolin containers before restart
  ansible.builtin.systemd_service:
    name: "{{ container }}.service"
    state: stopped
  loop: "{{ (['pangolin_crowdsec_1'] if pangolin_crowdsec else []) + ['pangolin_traefik_1', 'pangolin_gerbil_1', 'pangolin_app_1'] }}"
  loop_control:
    loop_var: container
  when: pangolin_quadlets.changed
    or pangolin_pod.changed
    or pangolin_configs.changed
    or pangolin_traefik_selinux_policy.changed
  tags: pangolin

- name: Stop pangolin pod before restart
  ansible.builtin.systemd_service:
    name: pangolin_proxy_1-pod.service
    state: stopped
  when: pangolin_quadlets.changed
    or pangolin_pod.changed
    or pangolin_configs.changed
    or pangolin_traefik_selinux_policy.changed
  tags: pangolin

- name: Reset failed pangolin units before start
  ansible.builtin.command:
    cmd: >-
      systemctl reset-failed
      {{
        (
          ['pangolin_app_1.service', 'pangolin_gerbil_1.service', 'pangolin_traefik_1.service']
          + (['pangolin_crowdsec_1.service'] if pangolin_crowdsec else [])
          + ['pangolin_proxy_1-pod.service']
        ) | join(' ')
      }}
  changed_when: false
  tags: pangolin

- name: Start and enable pangolin containers
  ansible.builtin.systemd_service:
    name: "{{ container }}.service"
    state: started
    enabled: true
  loop: "{{ ['pangolin_app_1', 'pangolin_gerbil_1', 'pangolin_traefik_1'] + (['pangolin_crowdsec_1'] if pangolin_crowdsec else []) }}"
  loop_control:
    loop_var: container
  tags: pangolin

# --- Initial setup token handling -------------------------------------------
# Pangolin prints a one-time setup token the first time the container starts.
# After the first admin is created, the token is invalidated and never reappears.
# We persist the token to a host file so it survives journal rotation, and we
# skip the capture on subsequent deploys so the playbook stays idempotent.

- name: Check whether Pangolin initial setup is still pending
  ansible.builtin.stat:
    path: /etc/pangolin/db.sqlite
  register: pangolin_db_stat
  changed_when: false
  tags: pangolin

- name: Read persisted Pangolin setup token (if any)
  ansible.builtin.slurp:
    src: /etc/pangolin/.initial_setup_token
  register: pangolin_persisted_token
  failed_when: false
  changed_when: false
  when: pangolin_db_stat.stat.exists
  tags: pangolin

- name: Capture Pangolin initial setup token from container logs
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      # Pangolin emits the token between two markers; grab the line right after.
      podman logs pangolin_app_1 2>&1 | \
        awk '/=== SETUP TOKEN (GENERATED|EXISTS) ===/{flag=1; next} flag && /Token: /{sub(/.*Token: /,""); print; exit}'
  register: pangolin_token_capture
  changed_when: false
  retries: 30
  delay: 10
  until: pangolin_token_capture.stdout | trim | length > 0
  when: not pangolin_db_stat.stat.exists
  tags: pangolin

- name: Persist Pangolin initial setup token
  ansible.builtin.copy:
    content: "{{ pangolin_token_capture.stdout | trim }}"
    dest: /etc/pangolin/.initial_setup_token
    owner: root
    group: root
    mode: "0600"
  when: not pangolin_db_stat.stat.exists
  tags: pangolin

- name: Show Pangolin initial setup token (first deploy)
  ansible.builtin.debug:
    msg: >-
      Pangolin initial setup token: {{ pangolin_token_capture.stdout | trim }}
      Visit https://{{ pangolin_domain }}/auth/initial-setup to create the first admin.
      The token has been saved to /etc/pangolin/.initial_setup_token (mode 0600).
  when: not pangolin_db_stat.stat.exists
  tags: pangolin

- name: Show persisted Pangolin token (admin already provisioned)
  ansible.builtin.debug:
    msg: >-
      Pangolin initial setup token: {{ pangolin_persisted_token.content | b64decode | trim }}
      (loaded from /etc/pangolin/.initial_setup_token — admin already provisioned, token is invalidated)
  when: pangolin_db_stat.stat.exists
  tags: pangolin
# ---------------------------------------------------------------------------
