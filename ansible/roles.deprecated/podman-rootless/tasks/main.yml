---
- name: Enable IPv4 unprivileged port start to 0
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "0"
    state: present
    reload: true
  tags: sysctl

- name: Enable IPv4 ping group range
  ansible.posix.sysctl:
    name: net.ipv4.ping_group_range
    value: "0 2000000"
    state: present
    reload: true
  tags: sysctl

- name: Installing Podman
  community.general.apk:
    name:
      - podman
      - podman-bash-completion
      - podman-compose
      - podman-compose-bash-completion
      - slirp4netns
      - util-linux-login
      - linux-pam
    state: present
    update_cache: true
  tags: packages

- name: "Enable cgroups v2"
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: 'rc_cgroup_mode="unified"'
    state: present
  tags: system

- name: "Enable memory and pids controllers"
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    line: 'rc_cgroup_controllers="memory pids"'
    state: present
  tags: system

- name: Enable cgroup service
  ansible.builtin.service:
    name: cgroups
    enabled: true
    state: started
  tags: services

