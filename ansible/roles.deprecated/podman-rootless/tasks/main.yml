- name: "Ensure /etc/pam.d/su exists"
  ansible.builtin.file:
    path: "/etc/pam.d/su"
    state: touch
    owner: root
    group: root
    mode: "0644"
  tags: pam

- name: "Copying pam rule for 'su through wheel'"
  ansible.builtin.copy:
    owner: root
    group: root
    mode: "0755"
    src: "{{ role_path }}/files/su"
    dest: /etc/pam.d/su
  tags: pam

- name: "Setting subuid"
  ansible.builtin.copy:
    dest: /etc/subuid
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ ansible_user }}:100000:65536
  tags: user

- name: "Setting subgid"
  ansible.builtin.copy:
    dest: /etc/subgid
    owner: root
    group: root
    mode: "0644"
    content: |
      {{ ansible_user }}:100000:65536
  tags: user

- name: "Enable rootless user on conf.d/podman"
  ansible.builtin.lineinfile:
    path: /etc/conf.d/podman
    line: 'podman_user="{{ ansible_user }}"'
    state: present
  tags: podman

- name: "Copying env vars to profile.d"
  ansible.builtin.copy:
    owner: root
    group: root
    mode: "0644"
    src: "{{ role_path }}/files/rootless.sh"
    dest: /etc/profile.d/rootless-containers.sh
  tags: podman

- name: Create /etc/containers/nodocker
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    owner: root
    group: root
    mode: "0644"
  tags: podman

- name: "Enabling podman related services"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  with_items:
    - "cgroups"
    - "podman"
  tags: services
