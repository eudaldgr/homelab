---
- name: Install base packages
  community.general.apk:
    name:
      - nfs-utils
      - rpcbind
      - uuidgen
      - iptables
    state: present
    update_cache: true
  tags: packages

- name: Start and enable rpcbind service
  ansible.builtin.service:
    name: rpcbind
    state: started
    enabled: true
  tags: services

- name: Enable iptables modprobe
  ansible.builtin.modprobe:
    name: ip_tables
    state: present
    persistent: present
  tags: system

- name: Generate machine-id if not exists
  ansible.builtin.command:
    cmd: uuidgen > /etc/machine-id
    creates: /etc/machine-id
  tags: system

- name: Copying xdg-runtime-dir script to /etc/local.d
  ansible.builtin.template:
    owner: root
    group: root
    mode: "0755"
    src: "{{ role_path }}/templates/xdg-runtime-dir.start.j2"
    dest: /etc/local.d/xdg-runtime-dir.start
  tags: system

- name: Enable local service
  ansible.builtin.service:
    name: local
    state: started
    enabled: true
  tags: system

