- name: Create mount point directory if it doesn't exist
  ansible.builtin.file:
    path: "{{ nfs_mount_point | default('/mnt/nfs') }}"
    # owner: "{{ ansible_user }}"
    # group: "{{ ansible_user }}"
    state: directory
    mode: "0755"
  tags: nfs

- name: Mount NFS share
  ansible.builtin.mount:
    path: "{{ nfs_mount_point | default('/mnt/nfs') }}"
    src: "{{ nfs_server }}:{{ nfs_path }}"
    fstype: nfs
    opts: "{{ nfs_options | default('defaults,rw,hard,intr') }}"
    state: mounted
  when: nfs_server is defined and nfs_path is defined
  tags: nfs

- name: Ensure NFS mount persists across reboots
  ansible.builtin.mount:
    path: "{{ nfs_mount_point | default('/mnt/nfs') }}"
    src: "{{ nfs_server }}:{{ nfs_path }}"
    fstype: nfs
    opts: "{{ nfs_options | default('defaults,rw,hard,intr') }}"
    state: present
  when: nfs_server is defined and nfs_path is defined
  tags: nfs
