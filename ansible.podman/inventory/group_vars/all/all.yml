---
ansible_become: true
ansible_become_method: sudo

# NFS settings
app_data_dir: /mnt/nfs
nfs_options: nofail,x-systemd.automount,x-systemd.requires=network-online.target,x-systemd.mount-timeout=10s

# Komodo Stack settings
komodo_core_version: "1.19.5@sha256:a1cceb4f971443b1e9f2a767788f663d0afb6244ee2135f7fe3fd1036af37ade"
komodo_mongo_version: "8.2.2@sha256:bf5995bcccb65725aa81fd92e68449323c94b96bf1c1fa9f7acbc2a8ad518114"
komodo_periphery_version: "1.19.5@sha256:bd79cf960ed054fe8e02384322303e462448679b1149dde48bbef151417255b1"

komodo_core_1_jwt: "{{ secret_komodo_core_1_jwt }}"
komodo_core_1_passkey: "{{ secret_komodo_core_1_passkey }}"
komodo_core_1_webhook_secret: "{{ secret_komodo_core_1_webhook_secret }}"
komodo_mongo_1_passwd: "{{ secret_komodo_mongo_1_passwd }}"

# Forgejo Stack settings
forgejo_app_version: "12.0.4@sha256:dbb0f88677f0c65cd1b66fb83504225aa5a04c4bc4a5ffdf9fc9a3a6d5bb1c68"
