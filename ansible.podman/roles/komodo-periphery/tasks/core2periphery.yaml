---
- name: Fail if core public key is not available
  ansible.builtin.fail:
    msg: "komodo_core_public_key not found. Run komodo-core role first (same play/run) or enable fact cache."
  when: hostvars[groups['komodo_core'][0]].komodo_core_public_key is not defined

- name: Ensure periphery_keys volume exists
  containers.podman.podman_volume:
    name: periphery_keys
    state: present

- name: Get periphery_keys mountpoint # noqa: jinja[spacing]
  ansible.builtin.command: "podman volume inspect periphery_keys --format {{'{{.Mountpoint}}'}}"
  register: periphery_keys_mp_cmd
  changed_when: false

- name: Write core.pub into periphery_keys volume
  ansible.builtin.copy:
    content: "{{ hostvars[groups['komodo_core'][0]].komodo_core_public_key }}"
    dest: "{{ periphery_keys_mp_cmd.stdout }}/core.pub"
    owner: root
    group: root
    mode: "0644"
