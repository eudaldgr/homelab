---
- name: Ensure core_keys volume exists
  containers.podman.podman_volume:
    name: core_keys
    state: present

- name: Get core_keys mountpoint # noqa: jinja[spacing]
  ansible.builtin.command: "podman volume inspect core_keys --format {{'{{.Mountpoint}}'}}"
  register: core_keys_mp_cmd
  changed_when: false

- name: Fail if any periphery key is missing from cache
  ansible.builtin.fail:
    msg: "Missing komodo_periphery_public_key for {{ item }}. Run komodo-periphery first (or ensure fact cache works)."
  loop: "{{ groups['komodo_periphery'] }}"
  when: hostvars[item].komodo_periphery_public_key is not defined

- name: Write periphery pubkeys (inventory hosts)
  ansible.builtin.copy:
    content: "{{ hostvars[item].komodo_periphery_public_key }}"
    dest: "{{ core_keys_mp_cmd.stdout }}/{{ item }}.pub"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ groups['komodo_periphery'] }}"
  when: hostvars[item].komodo_periphery_public_key is defined
  register: periphery_pub_written

- name: Write extra periphery pubkeys (external)
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ core_keys_mp_cmd.stdout }}/{{ item.key }}.pub"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ (extra_periphery_pub_keys | default({})) | dict2items }}"
  when: extra_periphery_pub_keys is defined
  register: periphery_pub_written_extra

- name: Restart Komodo Core if periphery keys changed
  ansible.builtin.systemd_service:
    name: komodo_core_1.service
    state: restarted
  when: periphery_pub_written is changed
    or periphery_pub_written_extra is changed # noqa: no-handler
