- name: Create containers storage.conf
  ansible.builtin.blockinfile:
    path: "/home/{{ rootless_user }}/.config/containers/storage.conf"
    block: |
      [storage]
      driver = "overlay"
      rootless_storage_path = "/var/lib/containers/user/{{ rootless_user }}/storage"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Storage config"
    create: true
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0644"
  tags:
    - user
    - podman

- name: Enable Linger for user -> {{ rootless_user }}
  ansible.builtin.command:
    argv: [/usr/bin/loginctl, enable-linger, "{{ rootless_user }}"]
    creates: "/var/lib/systemd/linger/{{ rootless_user }}"
  tags: system

- name: Ensure directory exists -> /run/user/{{ rootless_uid.stdout | trim }}
  ansible.builtin.file:
    path: "/run/user/{{ rootless_uid.stdout | trim }}"
    state: directory
    owner: "{{ rootless_user }}"
    group: "{{ rootless_user }}"
    mode: "0700"
  tags:
    - user
    - podman

- name: Start and enable podman.socket for user -> {{ rootless_user }}
  become: true
  become_method: community.general.machinectl # noqa: schema
  become_user: "{{ rootless_user }}"
  vars:
    ansible_pipelining: true
  ansible.builtin.systemd_service:
    name: podman.socket
    state: started
    enabled: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ rootless_uid.stdout | trim }}"
  changed_when: false
  tags:
    - user
    - podman

- name: Setup age encryption for rootless user
  become: true
  become_method: community.general.machinectl # noqa: schema
  become_user: "{{ rootless_user }}"
  vars:
    ansible_pipelining: true
  tags:
    - age
    - sops
  block:
    - name: Create age secret directory
      ansible.builtin.file:
        path: "/home/{{ rootless_user }}/.config/sops/age"
        state: directory
        owner: "{{ rootless_user }}"
        group: "{{ rootless_user }}"
        mode: "0700"

    - name: Check if age key already exists
      ansible.builtin.stat:
        path: "/home/{{ rootless_user }}/.config/sops/age/keys.txt"
      register: age_key_file

    - name: Generate age key for rootless user -> {{ rootless_user }}
      ansible.builtin.command:
        argv:
          - /usr/bin/age-keygen
          - -o
          - /home/{{ rootless_user }}/.config/sops/age/keys.txt
      args:
        creates: "/home/{{ rootless_user }}/.config/sops/age/keys.txt"
      when: not age_key_file.stat.exists

    - name: Catch public age key and show it
      ansible.builtin.command:
        argv:
          - /usr/bin/age-keygen
          - -y
          - /home/{{ rootless_user }}/.config/sops/age/keys.txt
      register: age_public_key
      changed_when: false

    - name: Display public age key for rootless user -> {{ rootless_user }}
      ansible.builtin.debug:
        msg: >-
          Public age key for user '{{ rootless_user }}':
          {{ age_public_key.stdout }}
