[[action]]
name = "destroy-removed-gitops-stacks"
description = "Destroys GitOps stacks that Resource Sync is about to delete."
tags = ["system"]

[action.config]
run_at_startup = false
schedule_enabled = false
failure_alert = true
webhook_enabled = false
reload_deno_deps = false
file_contents = """
const SYNC = "main";
const DESTROY_TIMEOUT_MS = 120_000;
const POLL_MS = 1_000;

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function stackTargetId(target) {
  if (!target || target.type !== "Stack" || !target.id) {
    return null;
  }
  return target.id;
}

function updateId(update) {
  return update?.id ?? update?._id?.$oid ?? update?._id ?? null;
}

async function waitForDestroyUpdate(stack, update) {
  const id = updateId(update);
  const start = Date.now();

  if (!id) {
    throw new Error(`DestroyStack for '${stack}' did not return an update id`);
  }

  while (Date.now() - start < DESTROY_TIMEOUT_MS) {
    const current = await komodo.read("GetUpdate", { id });
    if (current?.status === "Complete") {
      if (current.success === false) {
        throw new Error(`DestroyStack failed for '${stack}'`);
      }
      return;
    }
    await sleep(POLL_MS);
  }

  throw new Error(`Timed out waiting for DestroyStack update to complete for '${stack}'`);
}

async function waitForStackIdle(stack) {
  const start = Date.now();

  while (Date.now() - start < DESTROY_TIMEOUT_MS) {
    const state = await komodo.read("GetStackActionState", { stack });
    if (!Object.values(state ?? {}).some((value) => value === true)) {
      return;
    }
    await sleep(POLL_MS);
  }

  throw new Error(`Timed out waiting for stack '${stack}' to become idle after destroy`);
}

const sync = await komodo.write("RefreshResourceSyncPending", { sync: SYNC });
const updates = sync?.info?.resource_updates ?? [];
const deletes = updates.filter((update) => update?.data?.type === "Delete");
let destroyed = 0;

for (const update of deletes) {
  const stack = stackTargetId(update.target);
  if (!stack) {
    continue;
  }

  console.log(`Destroying removed GitOps stack: ${stack}`);
  const destroy = await komodo.execute("DestroyStack", {
    stack,
    services: [],
    remove_orphans: true,
    stop_time: null,
  });
  await waitForDestroyUpdate(stack, destroy);
  await waitForStackIdle(stack);
  destroyed += 1;
}

console.log(`Destroyed ${destroyed} removed GitOps stack(s).`);
"""

[[action]]
name = "deploy-changed-gitops-stacks"
description = "Deploys changed GitOps stacks without a hard-coded stack list."
tags = ["system"]

[action.config]
run_at_startup = false
schedule_enabled = false
failure_alert = true
webhook_enabled = false
reload_deno_deps = false
file_contents = """
const stacks = await komodo.read("ListStacks", {
  query: {},
});

let checked = 0;
for (const stack of stacks) {
  const name = stack.name ?? stack.id;
  if (!name) {
    continue;
  }

  console.log(`Checking GitOps stack for changes: ${name}`);
  await komodo.execute("DeployStackIfChanged", {
    stack: name,
    stop_time: null,
  });
  checked += 1;
}

console.log(`Checked ${checked} GitOps stack(s) for changes.`);
"""
