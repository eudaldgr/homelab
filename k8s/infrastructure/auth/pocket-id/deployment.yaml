apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: pocket-id
  labels:
    app.kubernetes.io/name: pocket-id
    app.kubernetes.io/part-of: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
        app.kubernetes.io/part-of: identity
      annotations:
        secret.reloader.stakater.com/reload: pocket-id-runtime,pocket-id-smtp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:v2.14.0-distroless@sha256:e0f83a42a78d0759b6d2d8c7380ef0fa8a4c95dfa01ad88740a073ae9cc4ba94
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 1411
              protocol: TCP
          env:
            - name: APP_URL
              value: https://sso.eudald.gr
            - name: DB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: pocket-id-postgresql-app
                  key: uri
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-runtime
                  key: ENCRYPTION_KEY
            - name: STATIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-runtime
                  key: STATIC_API_KEY
            - name: FILE_BACKEND
              value: database
            - name: TRUST_PROXY
              value: "true"
            - name: ALLOW_INSECURE_CALLBACK_URLS
              value: "false"
            - name: UI_CONFIG_DISABLED
              value: "true"
            - name: APP_NAME
              value: Homelab SSO
            - name: ALLOW_USER_SIGNUPS
              value: disabled
            - name: REQUIRE_USER_EMAIL
              value: "true"
            - name: EMAILS_VERIFIED
              value: "true"
            - name: SMTP_SKIP_CERT_VERIFY
              value: "false"
            - name: EMAIL_LOGIN_NOTIFICATION_ENABLED
              value: "true"
            - name: EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED
              value: "true"
            - name: EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED
              value: "false"
            - name: EMAIL_API_KEY_EXPIRATION_ENABLED
              value: "true"
            - name: EMAIL_VERIFICATION_ENABLED
              value: "true"
            - name: ACCENT_COLOR
              value: "teal"
            - name: ANALYTICS_DISABLED
              value: "true"
            - name: VERSION_CHECK_DISABLED
              value: "true"
            - name: LOG_JSON
              value: "true"
            - name: LOG_LEVEL
              value: info
            - name: AUDIT_LOG_RETENTION_DAYS
              value: "90"
          envFrom:
            - secretRef:
                name: pocket-id-smtp
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
