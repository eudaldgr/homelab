apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pocket-id-postgresql-backup
  namespace: pocket-id
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 0 2 * * *"  # Daily at 2 AM instead of weekly
  backupOwnerReference: self
  cluster:
    name: pocket-id-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: pocket-id-b2-store  # Backup to B2 for offsite storage
