---
# Local RustFS backup (fast recovery)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pocket-id-rustfs-store
  namespace: pocket-id
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: 14d
  configuration:
    destinationPath: s3://postgres/auth/pocket-id-postgresql
    endpointURL: http://ds920plus.home.eudald.gr:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-credentials
        key: AWS_SECRET_ACCESS_KEY
---
# Offsite Backblaze B2 backup (disaster recovery)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pocket-id-b2-store
  namespace: pocket-id
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://e17n-homelab-cnpg-b2/auth/pocket-id-postgresql
    endpointURL: https://s3.eu-central-003.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: b2-cnpg-credentials
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: b2-cnpg-credentials
        key: AWS_SECRET_ACCESS_KEY
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-postgresql
  namespace: pocket-id
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
    storageClass: synology-iscsi-nvme
  walStorage:
    size: 5Gi
    storageClass: synology-iscsi-nvme
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: 128MB
      huge_pages: "off"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: pocket-id-rustfs-store
  externalClusters:
    - name: pocket-id-postgresql-b2-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pocket-id-b2-store
    - name: pocket-id-postgresql-rustfs-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pocket-id-rustfs-store
  monitoring:
    enablePodMonitor: false
  minSyncReplicas: 1
  maxSyncReplicas: 1
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
