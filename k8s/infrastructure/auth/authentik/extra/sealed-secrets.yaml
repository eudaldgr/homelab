---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-core-secrets
  namespace: auth
spec:
  encryptedData:
    AUTHENTIK_BOOTSTRAP_EMAIL: 
    AUTHENTIK_BOOTSTRAP_PASSWORD: 
    AUTHENTIK_BOOTSTRAP_TOKEN: 
    AUTHENTIK_SECRET_KEY: 
  template:
    metadata:
      name: authentik-core-secrets
      namespace: auth
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authentik-blueprint-secrets
  namespace: auth
spec:
  encryptedData:
    ADMIN_EMAIL: 
    ADMIN_NAME: 
    ADMIN_USERNAME: 
    USER_EMAIL: 
    USER_NAME: 
    USER_USERNAME: 
  template:
    metadata:
      name: authentik-blueprint-secrets
      namespace: auth
