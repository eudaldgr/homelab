# Falco values — tuned for a Talos homelab on a small node.
# Driver: modern_ebpf is preferred but requires BTF and kernel
# headers. Falling back to kmod if modern_ebpf cannot attach.
# Collectors enabled so Falco can resolve container names; the
# custom_rules_file points at the ConfigMap we ship alongside.
falco:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  driver:
    kind: modern_ebpf
    loadRaw: false
  http_output:
    enabled: true
    url: "http://falcosidekick.falco.svc.cluster.local:2801"
  collectors:
    enabled: true
    container: true
  custom_rules_file: /etc/falco/falco_rules.local.yaml

# Sidekick: ships events to Loki / Prometheus / Slack.
# Disable the bundled UI to keep the surface small.
falcosidekick:
  enabled: true
  webui:
    enabled: false
  config:
    prometheus:
      enabled: true
      listen_port: 2801
    loki:
      enabled: true
      hostport: "loki.monitoring.svc.cluster.local:3100"
    slack:
      enabled: false

# No service mesh, no extra daemonset tweaks.
tty: false
ipv6: false
