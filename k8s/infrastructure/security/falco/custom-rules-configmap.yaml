---
# Custom Falco rules for the eudaldgr homelab.
#
# Mounted into /etc/falco/falco_rules.local.yaml by the Falco
# DaemonSet. Rules are adapted from the upstream peekoff/homelab
# config but rewritten against the apps actually deployed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-custom-rules
  namespace: falco
data:
  eudald_rules.yaml: |
    # --- Media stack: Plex + *arr + qBittorrent -----------------------------
    - rule: Media Stack Shell Spawn
      desc: Detect shell access in Plex/*arr/qBittorrent containers
      condition: >
        spawned_process and
        proc.name in (bash, sh, zsh, fish, ksh, ash) and
        container.image.repository in (
          "ghcr.io/hotio/plex", "ghcr.io/hotio/sonarr", "ghcr.io/hotio/radarr",
          "ghcr.io/hotio/lidarr", "ghcr.io/hotio/qbittorrent",
          "ghcr.io/hotio/prowlarr", "ghcr.io/hotio/tautulli", "ghcr.io/hotio/seerr",
          "lscr.io/linuxserver/plex", "lscr.io/linuxserver/sonarr",
          "lscr.io/linuxserver/radarr", "lscr.io/linuxserver/lidarr",
          "lscr.io/linuxserver/qbittorrent", "lscr.io/linuxserver/tautulli"
        )
      output: >
        Shell spawned in media container
        (user=%user.name command=%proc.cmdline container=%container.name
        image=%container.image.repository namespace=%k8s.ns.name pod=%k8s.pod.name)
      priority: WARNING
      tags: [media, shell, process]

    - rule: Media Stack Sensitive File Read
      desc: Read of /etc/passwd, /etc/shadow or SSH keys in media containers
      condition: >
        open_read and
        container.image.repository in (
          "ghcr.io/hotio/plex", "ghcr.io/hotio/sonarr", "ghcr.io/hotio/radarr",
          "ghcr.io/hotio/lidarr", "ghcr.io/hotio/qbittorrent",
          "lscr.io/linuxserver/plex", "lscr.io/linuxserver/sonarr",
          "lscr.io/linuxserver/radarr", "lscr.io/linuxserver/lidarr",
          "lscr.io/linuxserver/qbittorrent"
        ) and
        fd.name in ("/etc/passwd", "/etc/shadow", "/root/.ssh/id_rsa",
                    "/root/.ssh/authorized_keys", "/home/*/.ssh/id_rsa")
      output: >
        Sensitive file read in media container
        (user=%user.name file=%fd.name container=%container.name
        namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [media, filesystem, sensitive]

    - rule: Qbittorrent Unexpected Outbound Port
      desc: qBittorrent reaching a port outside the expected BitTorrent range
      condition: >
        outbound and
        container.image.repository contains "qbittorrent" and
        fd.sport != 0 and
        not (fd.sport >= 6881 and fd.sport <= 6889) and
        fd.sport != 80 and fd.sport != 443
      output: >
        qBittorrent connecting to unexpected port
        (user=%user.name dst=%fd.sip.name:%fd.sport
        container=%container.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [media, qbittorrent, network]

    # --- Auth / secrets: Pocket ID + Vaultwarden ----------------------------
    - rule: Auth Service Unexpected Outbound
      desc: Pocket ID or Vaultwarden reaching the public internet
      condition: >
        outbound and
        container.image.repository in (
          "ghcr.io/pocket-id/pocket-id", "vaultwarden/server", "vaultwarden"
        ) and
        not fd.sip.name in ("pocket-id-postgresql-rw.pocket-id.svc.cluster.local",
                            "pocket-id.pocket-id.svc.cluster.local",
                            "vaultwarden-postgresql.vaultwarden.svc.cluster.local",
                            "vaultwarden.vaultwarden.svc.cluster.local") and
        not (container.image.repository = "ghcr.io/pocket-id/pocket-id" and
             fd.sport in (465, 587, 2525)) and
        fd.sport != 53
      output: >
        Unexpected outbound connection from auth workload
        (user=%user.name dst=%fd.sip.name:%fd.sport container=%container.name
        namespace=%k8s.ns.name)
      priority: CRITICAL
      tags: [auth, exfiltration, network]

    - rule: Pocket ID Outbound DNS Anomaly
      desc: Pocket ID resolving domains outside cluster DNS
      condition: >
        outbound and
        container.image.repository = "ghcr.io/pocket-id/pocket-id" and
        fd.sport = 53 and
        not fd.sip.name in (
          "kube-dns.kube-system.svc.cluster.local",
          "coredns.coredns.svc.cluster.local"
        )
      output: >
        Pocket ID resolving via unknown DNS server
        (user=%user.name dns=%fd.sip.name container=%container.name)
      priority: WARNING
      tags: [auth, dns, anomaly]

    # --- Network infra: AdGuard, ExternalDNS, Pangolin -----------------------
    - rule: AdGuard Config Tamper
      desc: Modifications to AdGuard config outside the known data path
      condition: >
        open_write and
        container.image.repository in ("adguard/adguardhome", "ghcr.io/AdguardTeam/AdGuardHome") and
        fd.name startswith "/opt/adguardhome/work" and
        not fd.name endswith "/data/stats.db"
      output: >
        AdGuard config or filter file modified
        (user=%user.name file=%fd.name container=%container.name
        namespace=%k8s.ns.name)
      priority: WARNING
      tags: [network, adguard, filesystem]

    - rule: DNS Service Unexpected Outbound
      desc: ExternalDNS or AdGuard reaching non-DNS, non-CRD targets
      condition: >
        outbound and
        container.image.repository in (
          "registry.k8s.io/external-dns/external-dns",
          "adguard/adguardhome", "ghcr.io/AdguardTeam/AdGuardHome"
        ) and
        fd.sport != 53 and
        not fd.sport in (80, 443) and
        not fd.sip.name endswith ".svc.cluster.local"
      output: >
        DNS workload reaching a non-cluster target
        (user=%user.name dst=%fd.sip.name:%fd.sport
        container=%container.name namespace=%k8s.ns.name)
      priority: WARNING
      tags: [network, dns, exfiltration]

    # --- Web: SearXNG, BentoPDF --------------------------------------------
    - rule: Web App Privilege Escalation
      desc: sudo/su/doas spawned inside web app containers
      condition: >
        spawned_process and
        proc.name in (sudo, su, doas) and
        container.image.repository in (
          "searxng/searxng", "bentopdf/bentopdf", "ghcr.io/searxng/searxng"
        )
      output: >
        Privilege escalation attempt in web container
        (user=%user.name command=%proc.cmdline container=%container.name
        namespace=%k8s.ns.name)
      priority: HIGH
      tags: [web, privilege, escalation]

    # --- Cluster-wide signals ----------------------------------------------
    - rule: Cilium Or Cilium Policy Tamper
      desc: kubectl/curl/python touching Cilium CNIs or CNPs
      condition: >
        spawned_process and
        proc.name in (kubectl, curl, wget, python, python3) and
        k8s.ns.name in ("cilium", "kube-system") and
        proc.cmdline contains "CiliumNetworkPolicy"
      output: >
        Possible policy tampering from inside the cluster
        (user=%user.name command=%proc.cmdline namespace=%k8s.ns.name
        pod=%k8s.pod.name)
      priority: HIGH
      tags: [cluster, network, tamper]
