---
# Kyverno ClusterPolicy: privileged containers are forbidden in
# application namespaces. Cluster operators can still run privileged
# workloads in their own namespaces via explicit exclusion.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: >-
      Application pods must not run as privileged and must not enable
      privilege escalation. SecurityContext.privileged=false and
      allowPrivilegeEscalation=false are mandatory.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cilium
                - proxmox-csi
                - csi-proxmox
                - intel-gpu
                - monitoring
                - sealed-secrets
                - velero
      validate:
        message: >-
          Pods must not set securityContext.privileged=true and every
          container must set allowPrivilegeEscalation=false.
        pattern:
          spec:
            =(securityContext):
              =(privileged): "false|undefined"
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
