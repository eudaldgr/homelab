---
# Kyverno ClusterPolicy: enforce the standard recommended Kubernetes
# label set on every workload resource. Aligns with the labels the
# existing application-set.yaml already stamps on Applications, so we
# can grep and dashboard consistently.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-app-labels
  annotations:
    policies.kyverno.io/title: Require app.kubernetes.io/* Labels
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Workload resources (Deployment, StatefulSet, DaemonSet, Job,
      CronJob) must carry the recommended app.kubernetes.io/{name,
      part-of, managed-by} labels. Makes the cluster navigable and
      auditable.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: workload-must-have-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Job
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - kyverno
                - gatekeeper-system
                - falco
                - monitoring
                - cilium
                - system-upgrade
      validate:
        message: >-
          Workload is missing one of the required app.kubernetes.io
          labels (name, part-of, managed-by).
        pattern:
          metadata:
            labels:
              app.kubernetes.io/name: "?*"
              app.kubernetes.io/part-of: "?*"
              app.kubernetes.io/managed-by: "?*"
