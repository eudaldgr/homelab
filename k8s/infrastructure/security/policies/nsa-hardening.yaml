---
# NSA / CISA Kubernetes Hardening Guidance v1.2
#
# Audit mode by default — flip validationFailureAction to Enforce
# once the cluster is clean of legacy workloads.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nsa-hardening-all-namespaces
  annotations:
    policies.kyverno.io/title: NSA/CISA Hardening (all namespaces)
    policies.kyverno.io/category: Security
    policies.kyverno.io/description: >-
      Enforce non-root, read-only rootfs, dropped capabilities, and
      disabled host namespace sharing cluster-wide, mirroring the
      NSA/CISA Kubernetes Hardening Guidance.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-non-root-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - cert-manager
                - sealed-secrets
                - kyverno
                - monitoring
                - external-dns
                - cilium
                - coredns
                - gateway
                - velero
                - cnpg-system
                - cloudnative-pg
                - proxmox-csi
                - intel-gpu
                - nfd
                - inteldeviceplugins-system
                - kubelet-serving-cert-approver
                - newt
      validate:
        message: >-
          Containers must run as non-root (securityContext.runAsNonRoot=true).
          NSA/CISA 3.4.4.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: require-dropped-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - cert-manager
                - sealed-secrets
                - kyverno
                - monitoring
                - external-dns
                - cilium
                - coredns
                - gateway
                - velero
                - cnpg-system
                - cloudnative-pg
                - proxmox-csi
                - intel-gpu
                - nfd
                - inteldeviceplugins-system
                - kubelet-serving-cert-approver
                - newt
      validate:
        message: >-
          All containers (and init/ephemeral containers) must drop ALL
          Linux capabilities. NSA/CISA 5.1.5.
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
            =(initContainers):
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
            =(ephemeralContainers):
              - securityContext:
                  capabilities:
                    drop:
                      - ALL
    - name: require-read-only-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - cert-manager
                - sealed-secrets
                - kyverno
                - monitoring
                - external-dns
                - cilium
                - coredns
                - gateway
                - velero
                - cnpg-system
                - cloudnative-pg
                - proxmox-csi
                - intel-gpu
                - nfd
                - inteldeviceplugins-system
                - kubelet-serving-cert-approver
                - newt
      validate:
        message: >-
          All containers (and init/ephemeral containers) must set
          readOnlyRootFilesystem=true. NSA/CISA 4.2.1.
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
            =(initContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
            =(ephemeralContainers):
              - securityContext:
                  readOnlyRootFilesystem: true
    - name: disallow-host-namespace-sharing
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - cert-manager
                - sealed-secrets
                - kyverno
                - monitoring
                - external-dns
                - cilium
                - coredns
                - gateway
                - velero
                - cnpg-system
                - cloudnative-pg
                - proxmox-csi
                - intel-gpu
                - nfd
                - inteldeviceplugins-system
                - kubelet-serving-cert-approver
                - newt
      validate:
        message: >-
          Pods must not share host PID/IPC/Network namespaces.
          NSA/CISA 5.2.2.
        pattern:
          spec:
            =(hostPID): false
            =(hostIPC): false
            =(hostNetwork): false
