---
# Kyverno ClusterPolicy: every container (regular, init, ephemeral)
# must declare CPU and memory requests and limits.
#
# Pairs with the global rule "container resources cpu/memory
# requests and limits, even with custom values" so we catch drift
# before it lands in the cluster.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Requests + Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      All containers must declare resources.requests.cpu, .memory and
      resources.limits.cpu, .memory. Applies to containers, initContainers
      and ephemeralContainers.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: container-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - kyverno
                - monitoring
                - sealed-secrets
                - velero
                - cnpg-system
                - cloudnative-pg
      validate:
        message: >-
          Every container must declare both resources.requests.{cpu,memory}
          and resources.limits.{cpu,memory}. Empty values are rejected.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
