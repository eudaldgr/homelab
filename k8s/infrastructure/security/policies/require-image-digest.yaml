---
# Kyverno ClusterPolicy: every workload image must be pinned to a
# specific tag. Prevents accidental :latest / :main / untagged pulls.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-tag
  annotations:
    policies.kyverno.io/title: Require Pinned Image Tag
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/description: >-
      Container images must be pinned to a specific tag. The tag may not
      be a moving reference such as :latest, :main, :stable or :dev.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: image-tag-not-moving
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
                - UPDATE
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - kyverno
                - gatekeeper-system
                - falco
                - monitoring
                - kubelet-serving-cert-approver
      validate:
        message: >-
          Image tag must be a pinned version, not :latest / :main /
          :stable / :dev. Use a digest (@sha256:...) for supply-chain
          integrity.
        cel:
          expressions:
            - expression: >-
                !has(object.spec) ||
                (
                  object.spec.containers.all(container,
                    !(
                      container.image.endsWith(':latest') ||
                      container.image.endsWith(':main') ||
                      container.image.endsWith(':stable') ||
                      container.image.endsWith(':dev')
                    )
                  ) &&
                  (
                    !has(object.spec.initContainers) ||
                    object.spec.initContainers.all(container,
                      !(
                        container.image.endsWith(':latest') ||
                        container.image.endsWith(':main') ||
                        container.image.endsWith(':stable') ||
                        container.image.endsWith(':dev')
                      )
                    )
                  ) &&
                  (
                    !has(object.spec.ephemeralContainers) ||
                    object.spec.ephemeralContainers.all(container,
                      !(
                        container.image.endsWith(':latest') ||
                        container.image.endsWith(':main') ||
                        container.image.endsWith(':stable') ||
                        container.image.endsWith(':dev')
                      )
                    )
                  )
                )
