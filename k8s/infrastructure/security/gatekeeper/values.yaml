# Gatekeeper values — sane defaults for a homelab control plane.
# Audit by default; switch to deny once the cluster is clean.
replicas: 2

auditInterval: 60
logLevel: INFO
constraintViolationsInPayload: true

audit:
  logLevel: INFO
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

controllerManager:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

admissionWebhook:
  logLevel: INFO
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
