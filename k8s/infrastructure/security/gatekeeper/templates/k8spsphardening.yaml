---
# ConstraintTemplate: enforce NSA/CISA pod hardening via Rego, as a
# backstop to Kyverno. Kyverno remains the source of truth, this is
# belt + braces. Enforces:
#   - runAsNonRoot = true
#   - allowPrivilegeEscalation = false
#   - privileged = false
#   - readOnlyRootFilesystem = true
#   - capabilities drop ALL
#   - hostPID/hostIPC/hostNetwork = false
#   - hostPath volumes forbidden
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spsphardening
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    description: "NSA/CISA pod hardening constraints"
spec:
  crd:
    spec:
      names:
        kind: K8sPSPHardening
        listKind: K8sPSPHardeningList
        plural: k8spsphardening
        singular: k8spsphardening
      validation:
        # Schema is left open: K8sPSPHardening exposes no parameters
        # for now. Tune at the Constraint level via match.excludedNamespaces.
        openAPIV3Schema: {}
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spsphardening

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.securityContext.runAsNonRoot
          msg := sprintf("container %q must set securityContext.runAsNonRoot=true", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          c.securityContext.runAsNonRoot == false
          msg := sprintf("container %q must set securityContext.runAsNonRoot=true", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.securityContext.allowPrivilegeEscalation == false
          msg := sprintf("container %q must set securityContext.allowPrivilegeEscalation=false", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          c.securityContext.privileged == true
          msg := sprintf("container %q must not be privileged", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          c.securityContext.readOnlyRootFilesystem != true
          msg := sprintf("container %q must set securityContext.readOnlyRootFilesystem=true", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          drop_all := {cap | cap := c.securityContext.capabilities.drop[_]}
          not drop_all["ALL"]
          msg := sprintf("container %q must drop ALL capabilities", [c.name])
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostPID == true
          msg := "pod must not set spec.hostPID=true"
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostIPC == true
          msg := "pod must not set spec.hostIPC=true"
        }

        violation[{"msg": msg}] {
          input.review.object.spec.hostNetwork == true
          msg := "pod must not set spec.hostNetwork=true"
        }

        violation[{"msg": msg}] {
          v := input.review.object.spec.volumes[_]
          v.hostPath
          msg := sprintf("pod must not use hostPath volume (volume=%q)", [v.name])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }

        input_containers[c] {
          c := input.review.object.spec.initContainers[_]
        }
