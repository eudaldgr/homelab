---
# ConstraintTemplate: flag standard networking.k8s.io/v1 NetworkPolicy
# resources. This repo uses CiliumNetworkPolicy/CiliumClusterwideNetworkPolicy
# as the network-policy standard.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snetworkpolicyprohibited
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    description: "Prohibit standard Kubernetes NetworkPolicy resources"
spec:
  crd:
    spec:
      names:
        kind: K8sNetworkPolicyProhibited
      validation:
        openAPIV3Schema:
          type: object
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snetworkpolicyprohibited

        violation[{"msg": msg}] {
          input.review.kind.group == "networking.k8s.io"
          input.review.kind.kind == "NetworkPolicy"
          msg := "standard networking.k8s.io/v1 NetworkPolicy is prohibited; use CiliumNetworkPolicy instead"
        }
