---
# TalosUpgrade plan for the cluster.
# This is a one-shot plan: it watches all nodes (by default, no nodeSelector) and
# orchestrates an upgrade to the version in spec.talos.version. Once it reaches
# `Completed` it stays put — to upgrade again, bump spec.talos.version (Renovate
# will do this for you via the comment below).
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
  namespace: system-upgrade
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
    version: v1.13.3 # target Talos version (matches the running cluster on first install)

  policy:
    debug: false
    force: false
    # hard = upgrade job never schedules on a node it would itself reboot.
    placement: hard
    # Default reboot. Switch to "powercycle" for nodes that don't survive a soft reboot.
    rebootMode: default
    stage: false
    timeout: 30m
    priorityClassName: system-node-critical

  # Upgrade nodes one at a time (safest). Bump to 2-3 if you want faster rollouts
  # and you have spare capacity. Webhook enforces parallelism <= matching nodes.
  parallelism: 1

  drain:
    enabled: true
    # disableEviction: false

  # Default health check: all nodes Ready before each upgrade.
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m

  # talosctl runs inside the controller container; default repo/tag is fine and
  # will auto-track the target Talos version. Override only if you have a
  # private mirror.
  talosctl:
    image:
      repository: ghcr.io/siderolabs/talosctl
      pullPolicy: IfNotPresent

  # Uncomment to restrict upgrades to a maintenance window (e.g. Sunday 02:00 UTC).
  # maintenance:
  #   windows:
  #     - start: "0 2 * * 0"
  #       duration: "4h"
  #       timezone: "Europe/Madrid"
  #
  # Uncomment to opt-in nodes via label (safer rollout):
  # nodeSelector:
  #   matchExpressions:
  #     - key: tuppr.home-operations.com/upgrade
  #       operator: In
  #       values: ["enabled"]
