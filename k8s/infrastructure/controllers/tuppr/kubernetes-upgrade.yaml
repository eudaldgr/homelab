---
# KubernetesUpgrade: only one is allowed per cluster (admission webhook enforces this).
# This upgrades kube-apiserver / controller-manager / scheduler / kubelet across
# the whole cluster. Coordinated with TalosUpgrade: the two CRs cannot run at
# the same time, so when both are in flight tuppr queues them automatically.
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
  namespace: system-upgrade
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.35.0 # target Kubernetes version (matches the running cluster on first install)
    # imageRepository: registry.k8s.io # override only if you mirror components

  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True")
      timeout: 10m

  talosctl:
    image:
      repository: ghcr.io/siderolabs/talosctl
      pullPolicy: IfNotPresent

  # Uncomment to restrict to a maintenance window.
  # maintenance:
  #   windows:
  #     - start: "0 3 * * 0"
  #       duration: "4h"
  #       timezone: "Europe/Madrid"
