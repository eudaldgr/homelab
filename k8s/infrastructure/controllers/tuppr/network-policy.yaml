---
# Network policy for the tuppr controller.
# The controller needs:
#   - DNS resolution (kube-dns UDP/TCP 53)
#   - The Kubernetes API (in-cluster)
#   - The Talos API on cluster nodes (port 50000, on node IPs)
#   - Webhook ingress from the API server
#   - Metrics scrape from kube-prometheus-stack (in monitoring namespace)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  description: "Network policy for the tuppr Talos/K8s upgrade controller"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tuppr
  ingress:
    # Admission webhook traffic from the Kubernetes API server.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Metrics scrape from kube-prometheus-stack Prometheus.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
            operator.prometheus.io/name: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Talos API on every node (host network on port 50000).
    - toCIDRSet:
        - cidr: 10.1.20.0/24
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
