apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: system-upgrade

resources:
- namespace.yaml
- network-policy.yaml
- talos-upgrade.yaml
- kubernetes-upgrade.yaml

labels:
- pairs:
    app.kubernetes.io/part-of: cluster-lifecycle
  includeSelectors: false
  includeTemplates: true

helmCharts:
- name: tuppr
  # OCI Helm chart published by home-operations. 0.2.6 is the latest as of 2026-06-13.
  # renovate: datasource=oci depName=ghcr.io/home-operations/charts/tuppr versioning=semver
  repo: oci://ghcr.io/home-operations/charts
  version: 0.2.9
  releaseName: tuppr
  namespace: system-upgrade
  includeCRDs: true
  valuesFile: values.yaml
