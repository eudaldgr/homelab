# Values for the home-operations/tuppr chart.
# Reference: https://github.com/home-operations/tuppr/blob/main/charts/tuppr/values.yaml

replicaCount: 1

image:
  repository: ghcr.io/home-operations/tuppr
  pullPolicy: IfNotPresent
  # Tag is left empty so the chart defaults to its appVersion (matches chart release).

# Default securityContext from the chart is already locked down
# (runAsNonRoot, readOnlyRootFilesystem, drop ALL caps). We only override what we need.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Notification via shoutrrr. Leave disabled until a sealed-secret is added.
notification:
  enabled: false
  secretName: ""
  secretKey: url

# Resource budget — tuppr is a small controller, well under 128Mi.
resources:
  limits:
    cpu: 200m
    memory: 192Mi
  requests:
    cpu: 25m
    memory: 64Mi

# The chart already ships sane tolerations so the controller can run on
# control-plane and cordoned nodes (so it can uncordon after a reboot).
# We only add the priority class to match other infra components.
priorityClassName: system-node-critical

service:
  type: ClusterIP
  port: 8080

controller:
  logLevel: info
  leaderElection:
    enabled: true
  metrics:
    port: 8080

webhook:
  enabled: true
  port: 9443

rbac:
  create: true

# Wire up Prometheus Operator scraping + bundled alerts.
# The kube-prometheus-stack CRDs are present in the monitoring namespace.
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: kube-prometheus-stack
  prometheusRule:
    enabled: true
    labels:
      release: kube-prometheus-stack
  dashboards:
    enabled: false # we don't ship a grafana-operator; the sidecar path can be enabled later.
