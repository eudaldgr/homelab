apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml

helmCharts:
- name: sealed-secrets
  repo: https://bitnami.github.io/sealed-secrets
  version: 2.19.1
  releaseName: sealed-secrets
  namespace: sealed-secrets
  includeCRDs: true
  valuesFile: values.yaml
