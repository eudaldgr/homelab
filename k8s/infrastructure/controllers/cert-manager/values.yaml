crds:
  enabled: true
  keep: true

extraArgs:
  - --v=2
  - --cluster-resource-namespace=$(POD_NAMESPACE)
  - --leader-election-namespace=kube-system

resources:
  limits:
    cpu: 75m
    memory: 96Mi
  requests:
    cpu: 75m
    memory: 96Mi
replicaCount: 1

webhook:
  securePort: 10260
  hostNetwork: true
  serviceType: ClusterIP
  extraArgs:
    - --secure-port=10260
  resources:
    limits:
      cpu: 125m
      memory: 144Mi
    requests:
      cpu: 125m
      memory: 144Mi
  securityContext:
    runAsNonRoot: true
  replicaCount: 1

cainjector:
  resources:
    limits:
      cpu: 40m
      memory: 72Mi
    requests:
      cpu: 40m
      memory: 72Mi
  replicaCount: 1
