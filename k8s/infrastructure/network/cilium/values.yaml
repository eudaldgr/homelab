# https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
kubeProxyReplacement: true
routingMode: native
autoDirectNodeRoutes: true

bandwidthManager:
  enabled: true
  bbr: true

# Talos specific
k8sServiceHost: 127.0.0.1
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - PERFMON
      - BPF
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# https://www.talos.dev/latest/talos-guides/network/host-dns/#forwarding-kube-dns-to-host-dns
# https://docs.cilium.io/en/stable/operations/performance/tuning/#ebpf-host-routing
bpf:
  hostLegacyRouting: false
  masquerade: true

endpointRoutes:
  enabled: true

# BGP control plane
bgpControlPlane:
  enabled: true

# https://docs.cilium.io/en/stable/network/concepts/ipam/
ipam:
  mode: kubernetes

ipv4NativeRoutingCIDR: 10.42.0.0/16

enableMulticast: false
multicast:
  enabled: false

operator:
  rollOutPods: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Roll out cilium agent pods automatically when ConfigMap is updated.
rollOutCiliumPods: true
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
agent: true
agentConfig:
  tolerations: []
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

l2announcements:
  enabled: false

extraConfig:
  enable-envoy-config: "false"
  enable-gateway-api: "false"
  enable-l2-announcements: "false"

externalIPs:
  enabled: true

loadBalancer:
  # https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#maglev-consistent-hashing
  algorithm: maglev
  mode: dsr

envoy:
  enabled: false

hubble:
  enabled: false

ingressController:
  enabled: false
  default: true
  loadbalancerMode: shared
  service:
    annotations:
      io.cilium/lb-ipam-ips: 10.1.20.105

# Network Policy Audit Mode - Log violations without blocking
policyAuditMode: false
