apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
- announce.yaml
- bgp.yaml
- ip-pool.yaml

helmCharts:
- name: cilium
  repo: https://helm.cilium.io
  version: 1.19.4
  namespace: kube-system
  releaseName: cilium
  includeCRDs: true
  valuesFile: values.yaml
