apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-passthrough
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      io.cilium/lb-ipam-ips: 10.1.20.113
  listeners:
    - protocol: TLS
      port: 443
      name: omada
      hostname: "omada.lab.home.eudald.gr"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
