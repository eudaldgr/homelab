apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-eudald
  namespace: gateway
spec:
  secretName: cert-eudald
  issuerRef:
    name: cloudflare-issuer-prod
    kind: ClusterIssuer
  dnsNames:
    - "k8s.eudald.gr"
    - "*.k8s.eudald.gr"
  usages:
    - digital signature
    - key encipherment
