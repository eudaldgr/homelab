apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-config
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: opencloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-csi
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-data
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: data
    app.kubernetes.io/part-of: opencloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: proxmox-csi
  resources:
    requests:
      storage: 10Gi
