apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  namespace: opencloud
  labels:
    app.kubernetes.io/name: collabora
    app.kubernetes.io/component: office
    app.kubernetes.io/part-of: opencloud
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabora
        app.kubernetes.io/component: office
        app.kubernetes.io/part-of: opencloud
    spec:
      serviceAccountName: opencloud
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collabora
          image: docker.io/collabora/code:26.04.2.1.1@sha256:fece3a479b4ca57e7186d0c715155526170e337deef55bbbbbc79ee93b0e72e1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
          args:
            - coolconfig generate-proof-key && exec /start-collabora-online.sh
          env:
            - name: aliasgroup1
              value: https://cloud.eudald.gr:443
            - name: DONT_GEN_SSL_CERT
              value: "YES"
            - name: extra_params
              value: >-
                --o:ssl.enable=false
                --o:ssl.ssl_verification=true
                --o:ssl.termination=true
                --o:welcome.enable=false
                --o:net.frame_ancestors=cloud.eudald.gr
                --o:home_mode.enable=true
                --o:num_prespawn_children=1
                --o:mount_jail_tree=false
                --o:security.capabilities=false
            - name: username
              value: admin
            - name: password
              valueFrom:
                secretKeyRef:
                  name: opencloud-admin
                  key: IDM_ADMIN_PASSWORD
          ports:
            - name: http
              containerPort: 9980
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
  namespace: opencloud
  labels:
    app.kubernetes.io/name: collabora
    app.kubernetes.io/component: office
    app.kubernetes.io/part-of: opencloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: collabora
  ports:
    - name: http
      appProtocol: http
      port: 9980
      targetPort: http
      protocol: TCP
