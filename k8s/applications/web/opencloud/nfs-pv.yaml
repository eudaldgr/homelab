apiVersion: v1
kind: PersistentVolume
metadata:
  name: opencloud-user-files
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: user-files
    app.kubernetes.io/part-of: opencloud
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: ds920plus.home.eudald.gr
    path: /volume1/k8s
  mountOptions:
    - nfsvers=4.1
    - nconnect=4
    - hard
    - noac
    - noatime
