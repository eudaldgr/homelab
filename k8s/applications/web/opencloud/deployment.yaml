apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/part-of: opencloud
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config,data
        backup.velero.io/backup-volumes-excludes: user-files
      labels:
        app.kubernetes.io/name: opencloud
        app.kubernetes.io/part-of: opencloud
    spec:
      serviceAccountName: opencloud
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize
          image: opencloudeu/opencloud:7.2.1@sha256:85a4d3ceb61626bdca9fc52c3c290692d0b07b7ba2e8315b1cd67ddedfc371a6
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ ! -s /etc/opencloud/opencloud.yaml ]; then
                exec /usr/bin/opencloud init --insecure=false
              fi
          env:
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-admin
                  key: IDM_ADMIN_PASSWORD
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
            - name: user-files
              mountPath: /data
              subPath: opencloud
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: opencloud
          image: opencloudeu/opencloud:7.2.1@sha256:85a4d3ceb61626bdca9fc52c3c290692d0b07b7ba2e8315b1cd67ddedfc371a6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          env:
            - name: OC_URL
              value: https://cloud.eudald.gr
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            - name: PROXY_ENABLE_BASIC_AUTH
              value: "false"
            - name: IDM_CREATE_DEMO_USERS
              value: "false"
            - name: STORAGE_USERS_DRIVER
              value: decomposed
            - name: STORAGE_USERS_DECOMPOSED_ROOT
              value: /data
            - name: STORAGE_USERS_DECOMPOSED_PROPAGATOR
              value: sync
            - name: OC_ADD_RUN_SERVICES
              value: collaboration
            - name: COLLABORA_DOMAIN
              value: office.eudald.gr
            - name: COLLABORATION_WOPI_SRC
              value: https://cloud.eudald.gr
            - name: COLLABORATION_APP_NAME
              value: CollaboraOnline
            - name: COLLABORATION_APP_PRODUCT
              value: Collabora
            - name: COLLABORATION_APP_ADDR
              value: https://office.eudald.gr
            - name: COLLABORATION_APP_ICON
              value: https://office.eudald.gr/favicon.ico
            - name: COLLABORATION_APP_INSECURE
              value: "false"
            - name: COLLABORATION_CS3API_DATAGATEWAY_INSECURE
              value: "false"
            - name: FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR
              value: eu.opencloud.api.collaboration
            - name: GRAPH_AVAILABLE_ROLES
              value: b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6
            - name: SEARCH_EXTRACTOR_TYPE
              value: tika
            - name: SEARCH_EXTRACTOR_TIKA_TIKA_URL
              value: http://tika:9998
            - name: FRONTEND_FULL_TEXT_SEARCH_ENABLED
              value: "true"
            - name: OC_LOG_LEVEL
              value: info
            - name: OC_LOG_COLOR
              value: "false"
            - name: OC_LOG_PRETTY
              value: "false"
            - name: TZ
              value: Europe/Madrid
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
            - name: data
              mountPath: /var/lib/opencloud
            - name: user-files
              mountPath: /data
              subPath: opencloud
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: user-files
          persistentVolumeClaim:
            claimName: opencloud-user-files
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
