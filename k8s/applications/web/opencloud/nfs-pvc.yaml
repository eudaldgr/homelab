apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencloud-user-files
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: user-files
    app.kubernetes.io/part-of: opencloud
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  volumeName: opencloud-user-files
  storageClassName: ""
