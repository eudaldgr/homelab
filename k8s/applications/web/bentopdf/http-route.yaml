---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
  namespace: bentopdf
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - pdf.eudald.gr
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bentopdf
      port: 80
