apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gramps-web
  namespace: gramps-web
  labels:
    app: gramps-web
    app.kubernetes.io/name: gramps-web
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: gramps-web
  replicas: 1
  selector:
    matchLabels:
      app: gramps-web
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app: gramps-web
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gramps-web
          image: ghcr.io/gramps-project/grampsweb:26.8.1@sha256:496a97ad6a937fe73b8fed6dbf7e5a2967ab60363c240735eb3b043ca6ba715c
          ports:
            - name: http
              containerPort: 5000
          env: &gramps-env
            - name: TZ
              value: Europe/Madrid
            - name: GRAMPSWEB_TREE
              value: Gramps Web
            - name: GRAMPSWEB_BASE_URL
              value: https://gramps.eudald.gr/
            - name: GRAMPSWEB_CELERY_CONFIG__broker_url
              value: redis://gramps-web-valkey:6379/0
            - name: GRAMPSWEB_CELERY_CONFIG__result_backend
              value: redis://gramps-web-valkey:6379/0
            - name: GRAMPSWEB_RATELIMIT_STORAGE_URI
              value: redis://gramps-web-valkey:6379/1
            - name: GUNICORN_NUM_WORKERS
              value: "2"
            - name: GRAMPSWEB_OIDC_ENABLED
              value: "true"
            - name: GRAMPSWEB_OIDC_ISSUER
              value: https://sso.eudald.gr/application/o/gramps-web/
            - name: GRAMPSWEB_OIDC_NAME
              value: Authentik
            - name: GRAMPSWEB_OIDC_SCOPES
              value: openid email profile groups
            - name: GRAMPSWEB_OIDC_ROLE_CLAIM
              value: groups
            - name: GRAMPSWEB_OIDC_GROUP_OWNER
              value: Gramps Owners
            - name: GRAMPSWEB_OIDC_GROUP_MEMBER
              value: Gramps Members
            - name: GRAMPSWEB_OIDC_AUTO_REDIRECT
              value: "true"
            - name: GRAMPSWEB_OIDC_DISABLE_LOCAL_AUTH
              value: "false"
            - name: GRAMPSWEB_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gramps-web-oidc
                  key: GRAMPSWEB_OIDC_CLIENT_ID
            - name: GRAMPSWEB_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gramps-web-oidc
                  key: GRAMPSWEB_OIDC_CLIENT_SECRET
          volumeMounts: &gramps-volume-mounts
            - name: data
              mountPath: /app/users
              subPath: users
            - name: data
              mountPath: /app/indexdir
              subPath: indexdir
            - name: data
              mountPath: /app/thumbnail_cache
              subPath: thumbnail_cache
            - name: data
              mountPath: /app/cache
              subPath: cache
            - name: data
              mountPath: /app/secret
              subPath: secret
            - name: data
              mountPath: /root/.gramps/grampsdb
              subPath: grampsdb
            - name: data
              mountPath: /app/media
              subPath: media
            - name: data
              mountPath: /tmp
              subPath: tmp
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext: &gramps-container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
        - name: gramps-web-celery
          image: ghcr.io/gramps-project/grampsweb:26.8.1@sha256:496a97ad6a937fe73b8fed6dbf7e5a2967ab60363c240735eb3b043ca6ba715c
          args:
            - celery
            - -A
            - gramps_webapi.celery
            - worker
            - --loglevel=INFO
            - --concurrency=2
          env: *gramps-env
          volumeMounts: *gramps-volume-mounts
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext: *gramps-container-security
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 10Gi
