apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-aio-data
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    homelab.eudald.gr/purpose: Nextcloud AIO user data
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: ds920plus.home.eudald.gr
    path: /volume1/k8s
  mountOptions:
    - nfsvers=4.1
    - nconnect=4
    - hard
    - noatime
