apiVersion: batch/v1
kind: Job
metadata:
  name: nextcloud-aio-nfs-bootstrap
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    homelab.eudald.gr/security-justification: Root is used only to initialize ownership on two retained NFS subdirectories.
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: storage-bootstrap
    spec:
      serviceAccountName: nextcloud-aio
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: initialize-nfs-directories
          image: ghcr.io/nextcloud-releases/aio-alpine:20260702_083546
          command:
            - /bin/sh
            - -eu
            - -c
          args:
            - |
              mkdir -p /aio-app/nextcloud/app /aio-data/nextcloud/data
              chown 33:33 /aio-app/nextcloud/app /aio-data/nextcloud/data
              chmod 0770 /aio-app/nextcloud/app /aio-data/nextcloud/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          volumeMounts:
            - name: aio-app
              mountPath: /aio-app
            - name: aio-data
              mountPath: /aio-data
      volumes:
        - name: aio-app
          persistentVolumeClaim:
            claimName: nextcloud-aio-nextcloud
        - name: aio-data
          persistentVolumeClaim:
            claimName: nextcloud-aio-nextcloud-data
