apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - cloud.k8s.eudald.gr
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=15552000; includeSubDomains
      backendRefs:
        - name: nextcloud-aio-apache
          port: 80
