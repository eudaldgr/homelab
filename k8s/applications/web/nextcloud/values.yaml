image:
  registry: docker.io
  repository: library/nextcloud
  flavor: apache
  tag: 34.0.1-apache@sha256:6444fc5450302534e850b4d23c05b5f06c7b0d25bd5ece716452061454699c58
  pullPolicy: IfNotPresent

replicaCount: 1

podAnnotations:
  backup.velero.io/backup-volumes: nextcloud-main,nextcloud-data
  secret.reloader.stakater.com/reload: nextcloud-secret

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  host: cloud.eudald.gr
  datadir: /mnt/data
  existingSecret:
    enabled: true
    secretName: nextcloud-secret
    usernameKey: NEXTCLOUD_ADMIN_USER
    passwordKey: NEXTCLOUD_ADMIN_PASSWORD
  containerPort: 80
  trustedDomains:
    - cloud.eudald.gr
    - cloud.k8s.eudald.gr
  defaultConfigs:
    redis.config.php: false
  extraEnv:
    - name: TZ
      value: Europe/Madrid
    - name: OVERWRITEHOST
      value: cloud.eudald.gr
    - name: OVERWRITECLIURL
      value: https://cloud.eudald.gr
    - name: TRUSTED_PROXIES
      value: 10.244.0.0/16 10.1.20.0/24
    - name: FORWARDED_FOR_HEADERS
      value: HTTP_X_FORWARDED_FOR
    - name: NEXTCLOUD_INIT_HTACCESS
      value: "true"
    - name: EUROOFFICE_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-secret
          key: EUROOFFICE_SECRET
    - name: FULLTEXTSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-secret
          key: FULLTEXTSEARCH_PASSWORD
    - name: IMAGINARY_SECRET
      valueFrom:
        secretKeyRef:
          name: nextcloud-secret
          key: IMAGINARY_SECRET
  phpConfigs:
    uploads.ini: |-
      memory_limit=512M
      upload_max_filesize=16G
      post_max_size=16G
      max_execution_time=3600
      max_input_time=3600
      output_buffering=0
  configs:
    homelab.config.php: |-
      <?php
      $CONFIG = array (
        'default_phone_region' => 'ES',
        'maintenance_window_start' => 1,
        'default_language' => 'ca',
        'default_locale' => 'ca_ES',
        'loglevel' => 2,
      );
  hooks:
    before-starting: |-
      #!/bin/sh
      set -eu

      occ() {
        runuser -u www-data -- php /var/www/html/occ "$@"
      }

      ensure_app() {
        app="$1"
        if [ ! -d "/var/www/html/custom_apps/${app}" ] && [ ! -d "/var/www/html/apps/${app}" ]; then
          attempt=1
          until occ app:install "${app}"; do
            if [ "${attempt}" -ge 5 ]; then
              echo "Could not install ${app} after ${attempt} attempts" >&2
              return 1
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
        else
          occ app:enable "${app}"
        fi
      }

      # Persist Redis configuration so the separate notify_push pod can read it
      # from the shared Nextcloud volume without receiving the Redis secret.
      # shellcheck disable=SC2016
      php -r '
        $config = [
          "memcache.local" => "\\OC\\Memcache\\APCu",
          "memcache.distributed" => "\\OC\\Memcache\\Redis",
          "memcache.locking" => "\\OC\\Memcache\\Redis",
          "redis" => [
            "host" => "nextcloud-redis",
            "port" => 6379,
            "password" => getenv("REDIS_HOST_PASSWORD"),
            "timeout" => 1.5,
          ],
        ];
        $contents = "<?php\n" . chr(36) . "CONFIG = " . var_export($config, true) . ";\n";
        file_put_contents("/var/www/html/config/zz-homelab-runtime.config.php", $contents);
      '
      chown root:www-data /var/www/html/config/zz-homelab-runtime.config.php
      chmod 0640 /var/www/html/config/zz-homelab-runtime.config.php

      # This deployment intentionally has no Talk backend or Talk app.
      occ app:disable spreed || true

      ensure_app notify_push
      chmod 0775 -R /var/www/html/custom_apps/notify_push/bin
      occ config:app:set notify_push base_endpoint --value="https://push.eudald.gr"

      ensure_app eurooffice
      occ config:system:set eurooffice editors_check_interval --value="0" --type=integer
      occ config:system:set eurooffice jwt_secret --value="${EUROOFFICE_SECRET}"
      occ config:app:set eurooffice jwt_secret --value="${EUROOFFICE_SECRET}"
      occ config:system:set eurooffice jwt_header --value="AuthorizationJwt"
      occ config:app:set eurooffice DocumentServerUrl --value="https://office.eudald.gr/"
      occ config:system:set enabledPreviewProviders 24 --value="OCA\\Eurooffice\\Preview"

      occ config:system:set enabledPreviewProviders 0 --value="OC\\Preview\\Imaginary"
      occ config:system:set enabledPreviewProviders 23 --value="OC\\Preview\\ImaginaryPDF"
      occ config:system:set preview_imaginary_url --value="http://nextcloud-imaginary:9000"
      occ config:system:set preview_imaginary_key --value="${IMAGINARY_SECRET}"

      ensure_app fulltextsearch
      ensure_app fulltextsearch_elasticsearch
      ensure_app files_fulltextsearch
      encoded_password="$(php -r 'echo rawurlencode(getenv("FULLTEXTSEARCH_PASSWORD"));')"
      occ fulltextsearch:configure '{"search_platform":"OCA\\FullTextSearch_Elasticsearch\\Platform\\ElasticSearchPlatform"}'
      occ fulltextsearch_elasticsearch:configure "{\"elastic_host\":\"http://elastic:${encoded_password}@nextcloud-fulltextsearch:9200\",\"elastic_index\":\"nextcloud\"}"
      occ files_fulltextsearch:configure '{"files_pdf":true,"files_office":true}'

      if [ ! -f /mnt/data/fts-index.done ]; then
        attempt=1
        until occ fulltextsearch:test; do
          if [ "${attempt}" -ge 18 ]; then
            echo "Fulltextsearch did not become ready in time" >&2
            exit 1
          fi
          attempt=$((attempt + 1))
          sleep 10
        done
        occ fulltextsearch:index '{"errors":"reset"}' --no-readline
        touch /mnt/data/fts-index.done
        chown www-data:www-data /mnt/data/fts-index.done
      fi
  strategy:
    type: Recreate
  securityContext: {}
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

nginx:
  enabled: false

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql-rw
  existingSecret:
    enabled: true
    secretName: nextcloud-postgresql-app
    usernameKey: username
    passwordKey: password
    databaseKey: dbname

mariadb:
  enabled: false

postgresql:
  enabled: false

externalRedis:
  enabled: true
  host: nextcloud-redis
  port: "6379"
  existingSecret:
    enabled: true
    secretName: nextcloud-secret
    passwordKey: REDIS_PASSWORD

redis:
  enabled: false

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [nextcloud]
                - key: app.kubernetes.io/component
                  operator: In
                  values: [app]
            topologyKey: kubernetes.io/hostname
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

collabora:
  enabled: false

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  existingClaim: nextcloud-app
  accessMode: ReadWriteOnce
  size: 20Gi
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data
    accessMode: ReadWriteMany
    size: 2Ti
    subPath: nextcloud

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 90
  successThreshold: 1
