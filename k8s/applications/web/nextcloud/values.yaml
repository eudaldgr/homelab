image:
  registry: docker.io
  repository: library/nextcloud
  flavor: apache
  tag: 34.0.1-apache@sha256:6444fc5450302534e850b4d23c05b5f06c7b0d25bd5ece716452061454699c58

replicaCount: 1

podAnnotations:
  backup.velero.io/backup-volumes: nextcloud-main,nextcloud-data
  secret.reloader.stakater.com/reload: nextcloud-secret

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  host: cloud.k8s.eudald.gr
  datadir: /mnt/data
  username: admin
  existingSecret:
    enabled: true
    secretName: nextcloud-secret
    usernameKey: NEXTCLOUD_ADMIN_USER
    passwordKey: NEXTCLOUD_ADMIN_PASSWORD
  containerPort: 80
  trustedDomains:
    - cloud.k8s.eudald.gr
    - cloud.eudald.gr
  extraEnv:
    - name: TZ
      value: Europe/Madrid
    - name: OVERWRITECLIURL
      value: https://cloud.k8s.eudald.gr
    - name: TRUSTED_PROXIES
      value: 10.244.0.0/16 10.1.20.0/24
    - name: FORWARDED_FOR_HEADERS
      value: HTTP_X_FORWARDED_FOR
  configs:
    homelab.config.php: |-
      <?php
      $CONFIG = array (
        'default_phone_region' => 'ES',
        'maintenance_window_start' => 1,
      );
  strategy:
    type: Recreate
  securityContext: {}
  podSecurityContext:
    fsGroup: 33
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

nginx:
  enabled: false

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-postgresql-rw
  existingSecret:
    enabled: true
    secretName: nextcloud-postgresql-app
    usernameKey: username
    passwordKey: password
    databaseKey: dbname

mariadb:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 8.0.3-debian-12-r1
    digest: sha256:ad7fdfaedb25b37b8015c39f019961c3e5a865d8ff5859a491acb4d9d9b85697
  auth:
    enabled: true
    existingSecret: nextcloud-secret
    existingSecretPasswordKey: REDIS_PASSWORD
  global:
    defaultStorageClass: proxmox-csi
  master:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: proxmox-csi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  replica:
    replicaCount: 0
    persistence:
      enabled: false

cronjob:
  enabled: true
  type: cronjob
  cronjob:
    schedule: "*/5 * * * *"
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - nextcloud
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - app
            topologyKey: kubernetes.io/hostname
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 33
      runAsGroup: 33
      capabilities:
        drop: ["ALL"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

collabora:
  enabled: true
  replicaCount: 1
  podAnnotations:
    secret.reloader.stakater.com/reload: nextcloud-secret
  autoscaling:
    enabled: false
  collabora:
    aliasgroups:
      - host: https://cloud.eudald.gr:443
        aliases:
          - https://cloud.k8s.eudald.gr:443
    extra_params: >-
      --o:ssl.enable=false
      --o:ssl.termination=true
      --o:num_prespawn_children=2
    server_name: office.eudald.gr
    existingSecret:
      enabled: true
      secretName: nextcloud-secret
      usernameKey: COLLABORA_USERNAME
      passwordKey: COLLABORA_PASSWORD
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClass: proxmox-csi
  size: 20Gi
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data
    accessMode: ReadWriteMany
    size: 2Ti
    subPath: data

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
  successThreshold: 1
