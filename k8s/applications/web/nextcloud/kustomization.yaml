apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nextcloud

resources:
- namespace.yaml
- sealed-secret.yaml
- database.yaml
- http-route.yaml

helmCharts:
- name: nextcloud
  repo: https://nextcloud.github.io/helm/
  version: 9.2.0 # renovate: datasource=helm depName=nextcloud/nextcloud
  releaseName: nextcloud
  namespace: nextcloud
  valuesFile: values.yaml

patches:
- target:
    kind: Deployment
    name: nextcloud
  patch: |-
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
