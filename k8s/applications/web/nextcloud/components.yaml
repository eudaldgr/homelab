apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-notify-push
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-notify-push
    app.kubernetes.io/component: push
    app.kubernetes.io/part-of: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-notify-push
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-notify-push
        app.kubernetes.io/component: push
        app.kubernetes.io/part-of: nextcloud
    spec:
      serviceAccountName: nextcloud-components
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [nextcloud]
                  - key: app.kubernetes.io/component
                    operator: In
                    values: [app]
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notify-push
          image: ghcr.io/nextcloud-releases/aio-notify-push:20260702_083546@sha256:ced157259dfbfe5e202a585e68fa19f713dc40a9c45a09a268bbf864097ed3f4
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              export RUST_LOG="${AIO_LOG_LEVEL}"
              until nc -z nextcloud 80; do
                echo "Waiting for Nextcloud to start..."
                sleep 5
              done
              cpu_arch="$(uname -m)"
              if [ "${cpu_arch}" != x86_64 ]; then
                cpu_arch=aarch64
              fi
              push_path="/var/www/html/custom_apps/notify_push/bin/${cpu_arch}/notify_push"
              until [ -x "${push_path}" ]; do
                echo "Waiting for the notify_push app binary..."
                sleep 5
              done
              exec "${push_path}" --port 7867 /var/www/html/config/config.php
          env:
            - name: AIO_LOG_LEVEL
              value: warn
            - name: NEXTCLOUD_HOST
              value: nextcloud
            - name: TZ
              value: Europe/Madrid
          ports:
            - name: http
              containerPort: 7867
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nextcloud-app
              mountPath: /var/www/html
              readOnly: true
      volumes:
        - name: nextcloud-app
          persistentVolumeClaim:
            claimName: nextcloud-app
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-notify-push
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-notify-push
    app.kubernetes.io/component: push
    app.kubernetes.io/part-of: nextcloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextcloud-notify-push
  ports:
    - name: http
      port: 7867
      targetPort: http
      protocol: TCP
