            exec:
              command: [/healthcheck.sh]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 9
          livenessProbe:
            exec:
              command: [/healthcheck.sh]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 9
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
