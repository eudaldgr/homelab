apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: nextcloud
      annotations:
        secret.reloader.stakater.com/reload: nextcloud-secret
    spec:
      serviceAccountName: nextcloud-components
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: ghcr.io/nextcloud-releases/aio-redis:20260702_083546@sha256:1389676f76029eb9791b7019e0f9fec37d7fe9cc321005013352ffc74a4ef49d
          imagePullPolicy: IfNotPresent
          env:
            - name: AIO_LOG_LEVEL
              value: warn
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: REDIS_PASSWORD
            - name: TZ
              value: Europe/Madrid
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: [/healthcheck.sh]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [/healthcheck.sh]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-redis
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nextcloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextcloud-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
