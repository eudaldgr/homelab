apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-redis
  namespace: nextcloud
spec:
  template:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: nextcloud-secret
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextcloud-aio-redis
          env:
            - name: REDIS_HOST_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
