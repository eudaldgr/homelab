apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memos
  namespace: memos
  labels:
    app: memos
    app.kubernetes.io/name: memos
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: memos
  replicas: 1
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app: memos
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memos
          image: ghcr.io/usememos/memos:0.29.1@sha256:3e1253477066eb2aefa91145f7f9038bb931ed88c8a3ee05310a933594cdba7d
          ports:
            - name: http
              containerPort: 5230
          env:
            - name: MEMOS_MODE
              value: prod
            - name: MEMOS_PORT
              value: "5230"
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: synology-iscsi-nvme
        resources:
          requests:
            storage: 5Gi
