apiVersion: apps/v1
kind: Deployment
metadata:
  name: kromgo
  namespace: kromgo
  annotations:
    configmap.reloader.stakater.com/reload: kromgo-config
  labels:
    app: kromgo
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kromgo
  template:
    metadata:
      labels:
        app: kromgo
        app.kubernetes.io/name: kromgo
        app.kubernetes.io/part-of: applications
        app.kubernetes.io/managed-by: argocd
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: kromgo-config
      containers:
        - name: kromgo
          image: ghcr.io/home-operations/kromgo:0.15.1@sha256:45be63a0bd3d8e2bd6109a914ab7b7f2dd796b4e5ad82ec3e218e4f49524b906
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: KROMGO_QUERY_TIMEOUT
              value: 30s
            - name: KROMGO_SERVER_READ_TIMEOUT
              value: 15s
            - name: KROMGO_SERVER_WRITE_TIMEOUT
              value: 60s
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
