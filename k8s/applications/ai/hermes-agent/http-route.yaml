apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - hermes.k8s.eudald.gr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hermes-agent
          port: 9119
