apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: hermes-agent
data:
  config.yaml: |
    model:
      default: "local-home-qwen"
      provider: "custom"
      base_url: "http://llama-cpp.llama-cpp.svc.cluster.local/v1"

    mcp_servers:
      home-assistant:
        url: "http://ha-mcp.home-assistant.svc.cluster.local:8086/mcp"
        connect_timeout: 30
        timeout: 120

    tool_loop_guardrails:
      hard_stop_enabled: true
      hard_stop_after:
        exact_failure: 5
        idempotent_no_progress: 5
