apiVersion: apps/v1
kind: Deployment
metadata:
  name: minicpm-vllm
  namespace: minicpm-vllm
  labels:
    app: minicpm-vllm
    app.kubernetes.io/name: minicpm-vllm
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minicpm-vllm
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: cache,tmp,shm
      labels:
        app: minicpm-vllm
        app.kubernetes.io/name: minicpm-vllm
        app.kubernetes.io/part-of: applications
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: minicpm-vllm
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minicpm-vllm
          image: docker.io/vllm/vllm-openai-cpu:v0.24.0-x86_64@sha256:00eeb8bfad017e2fd9ca9f18999e8417bebfa146a0eb4276b4c26c8272dc2377
          imagePullPolicy: IfNotPresent
          command:
            - vllm
          args:
            - serve
            - openbmb/MiniCPM5-1B
            - --served-model-name
            - local-home-minicpm
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --device
            - cpu
            - --max-model-len
            - "8192"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - minicpm5
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HF_HOME
              value: /models/huggingface
            - name: VLLM_CACHE_ROOT
              value: /models/vllm
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "2"
            - name: VLLM_CPU_NUM_OF_RESERVED_CPU
              value: "1"
          volumeMounts:
            - name: cache
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "2000m"
              memory: 4Gi
            limits:
              cpu: "4000m"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: minicpm-vllm-cache
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
