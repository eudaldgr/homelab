apiVersion: batch/v1
kind: CronJob
metadata:
  name: configarr
  namespace: arr
  labels:
    app.kubernetes.io/name: configarr
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  schedule: "0 0 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes: etc
            backup.velero.io/backup-volumes-excludes: tmp,run,var
          labels:
            app.kubernetes.io/name: configarr
            app.kubernetes.io/part-of: applications
            app.kubernetes.io/managed-by: argocd
        spec:
          restartPolicy: OnFailure
          hostNetwork: false
          hostPID: false
          hostIPC: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: etc
              persistentVolumeClaim:
                claimName: configarr-etc
            - name: var
              persistentVolumeClaim:
                claimName: configarr-var
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: run
              emptyDir:
                sizeLimit: 100Mi
          containers:
            - name: configarr
              image: ghcr.io/vegops/configarr:1.28.0-r0@sha256:17c39d2ed94e9f977c129c6c6efca43b5e34aeef8f457d7d1feefb5fdfb3e6c8
              imagePullPolicy: IfNotPresent
              env:
                - name: TZ
                  value: Europe/Madrid
              volumeMounts:
                - name: etc
                  mountPath: /configarr/etc
                - name: var
                  mountPath: /configarr/var
                - name: tmp
                  mountPath: /tmp
                - name: run
                  mountPath: /configarr/run
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
