apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
  namespace: arr
  labels:
    app: qbittorrent
spec:
  serviceName: qbittorrent
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: etc,var
        backup.velero.io/backup-volumes-excludes: media,tmp
      labels:
        app: qbittorrent
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      containers:
        - name: qbittorrent
          image: ghcr.io/vegops/qbittorrent:5.2.1-r1@sha256:fab45553631b9bd99208337fbf4b0f1901e5e0a30ad0638a3c2bc9951a10d266
          ports:
            - name: http
              containerPort: 8080
            - name: bittorrent-tcp
              containerPort: 65211
              protocol: TCP
            - name: bittorrent-udp
              containerPort: 65211
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Madrid
          volumeMounts:
            - name: etc
              mountPath: /qbittorrent/etc
            - name: var
              mountPath: /qbittorrent/var
            - name: media
              mountPath: /data/torrents
              subPath: torrents
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: etc
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: proxmox-csi
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: var
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: proxmox-csi
        resources:
          requests:
            storage: 5Gi
