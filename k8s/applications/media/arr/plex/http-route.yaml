---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  namespace: arr
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
  hostnames:
  - plex.eudald.gr
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: plex
      port: 32400
