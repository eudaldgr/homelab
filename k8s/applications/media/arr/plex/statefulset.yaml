apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
  namespace: arr
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: plex
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: config
        backup.velero.io/backup-volumes-excludes: media,tmp,run
      labels:
        app: plex
        app.kubernetes.io/name: plex
        app.kubernetes.io/part-of: applications
        app.kubernetes.io/managed-by: argocd
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 104
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-share
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir:
            sizeLimit: 100Mi
      containers:
        - name: plex
          image: ghcr.io/vegops/plex:1.43.2.10687-r2@sha256:ef8d0ddb5df2a2f6ae1403cdaff340bc529799ad8e5048f4de58260fa4c563f5
          ports:
            - name: http
              containerPort: 32400
          env:
            - name: TZ
              value: Europe/Madrid
          volumeMounts:
            - name: config
              mountPath: /plex/etc
            - name: media
              mountPath: /data/media
              subPath: media
            - name: tmp
              mountPath: /plex/tmp
            - name: run
              mountPath: /run
          resources:
            requests:
              cpu: 100m
              ephemeral-storage: 512Mi
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              cpu: 4000m
              memory: 4Gi
              gpu.intel.com/i915: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
        kubernetes.io/arch: amd64
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 24Gi
