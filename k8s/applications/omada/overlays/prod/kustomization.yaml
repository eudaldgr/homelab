apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omada

resources:
  - ../../base
  - tls-route.yaml
  - cert-omada.yaml

helmCharts:
  - name: omada-controller-helm
    repo: oci://registry-1.docker.io/mbentley
    version: 1.0.1
    releaseName: omada-controller
    namespace: omada
    valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true
