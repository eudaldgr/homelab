apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: adguard-sync
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
  name: adguard-sync
  namespace: adguard
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: adguard-sync
        app.kubernetes.io/part-of: applications
        app.kubernetes.io/managed-by: argocd
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: adguard-sync
            app.kubernetes.io/part-of: applications
            app.kubernetes.io/managed-by: argocd
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
          containers:
            - name: adguard-sync
              image: ghcr.io/bakito/adguardhome-sync:alpine-v0.9.0@sha256:fc3accd883cda7d68f027811f34f213c23d8ed38c23f944fc58636456dc74329
              imagePullPolicy: IfNotPresent
              command: ["/opt/go/adguardhome-sync", "run", "--config", "/config.yaml"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              env:
                - name: ORIGIN_URL
                  value: "http://adguard-home-0.adguard.svc.cluster.local:80"
                - name: ORIGIN_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: adguard-admin-secret
                      key: username
                - name: ORIGIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: adguard-admin-secret
                      key: password
                - name: REPLICA1_URL
                  value: "http://adguard-home-1.adguard.svc.cluster.local:80"
                - name: REPLICA1_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: adguard-admin-secret
                      key: username
                - name: REPLICA1_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: adguard-admin-secret
                      key: password
                - name: PRINT_CONFIG_ONLY
                  value: "false"
                - name: LOG_LEVEL
                  value: "info"
                - name: API_PORT
                  value: "0"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          restartPolicy: OnFailure
