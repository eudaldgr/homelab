apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-home-0
  namespace: adguard
spec:
  parentRefs:
  - name: internal
    namespace: gateway
    sectionName: https-gateway
  - name: envoy-internal
    namespace: network
  hostnames:
  - "dns01.k8s.eudald.gr"
  rules:
  - backendRefs:
    - name: adguard-home-0
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-home-1
  namespace: adguard
spec:
  parentRefs:
  - name: internal
    namespace: gateway
    sectionName: https-gateway
  - name: envoy-internal
    namespace: network
  hostnames:
  - "dns02.k8s.eudald.gr"
  rules:
  - backendRefs:
    - name: adguard-home-1
      port: 80
