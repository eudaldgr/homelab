global:
  fullnameOverride: newt
  image:
    registry: docker.io
    repository: fosrl/newt
    tag: 1.13.0@sha256:63d956c8fdee889255e441ec405193b47b1fd2d975b505492ec848a8007f4fc3
    imagePullPolicy: IfNotPresent
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
  metrics:
    enabled: true
    adminAddr: ":2112"
    service:
      enabled: true
    serviceMonitor:
      enabled: true
  deploymentAnnotations:
    configmap.reloader.stakater.com/reload: newt-blueprint

newtInstances:
  - name: main-tunnel
    enabled: true
    auth:
      existingSecretName: newt-credentials
      createSecret: false
    acceptClients: true
    extraEnv:
      BLUEPRINT_FILE: /etc/newt/blueprint.yaml
    # In Kubernetes, Newt fronts Services declared in the blueprint; Docker socket integration stays disabled.
    dockerSocket:
      enabled: false
    service:
      enabled: true
      type: LoadBalancer
      annotations:
        io.cilium/lb-ipam-ips: "10.1.20.121"
    extraVolumes:
      - name: newt-blueprint
        configMap:
          name: newt-blueprint
    extraVolumeMounts:
      - name: newt-blueprint
        mountPath: /etc/newt
        readOnly: true
