  searxng:
    name: searxng
    protocol: http
    full-domain: searx.eudald.gr
    targets:
      - method: http
        hostname: searxng.searxng.svc.cluster.local
        port: 8080
        healthcheck:
          enabled: true
          hostname: searxng.searxng.svc.cluster.local
          port: 8080
          path: /healthz
          headers:
            - name: X-Real-IP
              value: 127.0.0.1

  vaultwarden:
    name: vaultwarden
    protocol: http
    full-domain: bitwarden.eudald.gr
    auth:
      sso-enabled: false
    rules:
      - action: deny
        match: path
        value: /admin
      - action: deny
        match: path
        value: /admin/*
    targets:
      - hostname: vaultwarden-0.vaultwarden.vaultwarden.svc.cluster.local
        port: 80
        method: http
        healthcheck:
          hostname: vaultwarden-0.vaultwarden.vaultwarden.svc.cluster.local
          port: 80
          mode: http
          scheme: http
          path: /alive
          method: GET

  memos:
    name: memos
    protocol: http
    full-domain: memos.eudald.gr
    auth:
      sso-enabled: true
    rules:
      - action: allow
        match: path
        value: /api/*
      - action: allow
        match: path
        value: /assets/*
      - action: allow
        match: path
        value: /explore*
      - action: allow
        match: path
        value: /memos.api.v1.*
      - action: allow
        match: path
        value: /auth/callback*
      - action: allow
        match: path
        value: /auth
      - action: allow
        match: path
        value: /site.webmanifest
      - action: allow
        match: path
        value: /logo.webp
      - action: allow
        match: path
        value: /full-logo.webp
      - action: allow
        match: path
        value: /android-chrome-192x192.png
    targets:
      - hostname: memos.memos.svc.cluster.local
        port: 5230
        method: http
        healthcheck:
          hostname: memos.memos.svc.cluster.local
          port: 5230
          mode: http
          scheme: http
          path: /
          method: GET

  it-tools:
