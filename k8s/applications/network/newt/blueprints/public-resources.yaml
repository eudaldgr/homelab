  bentopdf:
    name: bentopdf
    protocol: http
    full-domain: pdf.eudald.gr
    targets:
      - hostname: bentopdf.bentopdf.svc.cluster.local
        port: 80
        method: http
        healthcheck:
          hostname: bentopdf.bentopdf.svc.cluster.local
