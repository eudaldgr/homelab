---
resources:
  limits:
    cpu: 150m
    ephemeral-storage: 2Gi
    memory: 192Mi
  requests:
    cpu: 100m
    ephemeral-storage: 50Mi
    memory: 128Mi

provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/muhlba91/external-dns-provider-adguard
      tag: v11.0.2@sha256:162561ce7af084ee736a4c62c0bd3c0f12a3842d0ca8d96ac3665c15ef05add8
      pullPolicy: IfNotPresent
    service:
      port: 8888
    env:
      - name: ADGUARD_URL
        value: http://adguard-home-0.adguard.svc.cluster.local
      - name: ADGUARD_USER
        valueFrom:
          secretKeyRef:
            name: adguard-configuration
            key: user
      - name: ADGUARD_PASSWORD
        valueFrom:
          secretKeyRef:
            name: adguard-configuration
            key: password
      - name: LOG_LEVEL
        value: debug
      - name: DRY_RUN
        value: "false"
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      timeoutSeconds: 5

sources:
  - service
  - ingress
  - gateway-httproute

# Exclude resources with annotation external-dns.alpha.kubernetes.io/exclude=true
annotationFilter: "external-dns.alpha.kubernetes.io/exclude notin (true)"

publishInternalServices: true

policy: sync # syncs DNS records with the sources (create, update, delete)
