apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-mcp
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: ha-mcp
    app.kubernetes.io/part-of: applications
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-mcp
        app.kubernetes.io/part-of: applications
        app.kubernetes.io/managed-by: argocd
    spec:
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: ghcr.io/homeassistant-ai/ha-mcp:latest@sha256:7917b2d385e16e43f45f92fc72a757e5c0aec8d88b3cd69fe64f3b5106cbfe36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              /usr/local/bin/python -m venv /venv
              /venv/bin/pip install --upgrade pip
              /venv/bin/pip install fastmcp httpx jq textdistance pydantic python-dotenv truststore websockets
          volumeMounts:
            - name: venv
              mountPath: /venv
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ha-mcp
          image: ghcr.io/homeassistant-ai/ha-mcp:latest@sha256:7917b2d385e16e43f45f92fc72a757e5c0aec8d88b3cd69fe64f3b5106cbfe36
          imagePullPolicy: IfNotPresent
          command:
            - /venv/bin/python
            - -c
            - "from ha_mcp.__main__ import main_web; main_web()"
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: /app/src
            - name: HOMEASSISTANT_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
            - name: MCP_SECRET_PATH
              value: /mcp
            - name: HOMEASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ha-mcp-secrets
                  key: HOMEASSISTANT_TOKEN
          volumeMounts:
            - name: venv
              mountPath: /venv
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/mcpuser/.cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: venv
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
